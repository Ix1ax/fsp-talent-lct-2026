server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /docs { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location = /openapi.yaml { proxy_pass http://api:8080; }
  location = /healthz { proxy_pass http://api:8080; }
  location = /readyz { proxy_pass http://api:8080; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
