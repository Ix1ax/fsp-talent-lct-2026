      operationId: revokeMyConsent
      summary: Отозвать активное согласие
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Отзыв processing отзывает все активные согласия кандидата, скрывает профиль (search_status hidden) и закрывает контакты;
        данные не удаляются. Отзыв publication скрывает профиль. Повторная выдача статус профиля не восстанавливает. Для ats_transfer
        обязателен параметр company_id, для остальных видов он не допускается.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - processing
              - publication
              - ats_transfer
        - name: company_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Согласие отозвано.
        '400':
          description: Неизвестный вид или неверное использование company_id (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
