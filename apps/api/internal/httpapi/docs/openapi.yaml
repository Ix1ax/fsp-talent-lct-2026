openapi: 3.0.3
info:
  title: ФСП API
  version: 0.1.0
  description: Основа API. Продуктовые методы добавляются по мере реализации.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: liveness
      summary: Проверка процесса API
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /readyz:
    get:
      operationId: readiness
      summary: Доступность Postgres, Redis и S3-бакета
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Информация об API
      responses:
        '200':
          description: Версия сервиса
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - version
                properties:
                  name:
                    type: string
                    example: fsp-api
                  version:
                    type: string
                    example: 0.1.0
  /api/v1/me:
    get:
      operationId: getMe
      summary: Текущий пользователь приложения
      description: Требуется JWT access token с audience API и подтверждённым email. Если пользователь ещё не выбрал роль, возвращается 404 not_registered, и нужно вызвать POST /api/v1/me/register.
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Пользователь и его роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Учётная запись заблокирована или удалена (user_inactive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не зарегистрирован (not_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /api/v1/me/register:
    post:
      operationId: registerMe
      summary: Первичная регистрация пользователя с выбором роли
      description: Вызывается один раз после первого входа через Keycloak. Роль выбирает пользователь; роль admin через API выдать нельзя.
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - candidate
                    - employer
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Некорректное тело запроса (validation_error) или недопустимая роль (invalid_role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Пользователь уже зарегистрирован (already_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Публичная конфигурация входа через Keycloak
      responses:
        '200':
          description: Настройки SPA
          content:
            application/json:
              schema:
                type: object
                required:
                  - issuer
                  - client_id
                properties:
                  issuer:
                    type: string
                    format: uri
                  client_id:
                    type: string
                    example: fsp-web
        '503':
          description: Авторизация не настроена
  /api/v1/companies:
    post:
      operationId: createCompany
      summary: Создать компанию и стать её владельцем
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Требуется локальная роль employer. Компания и членство owner создаются одной транзакцией. Пользователь может состоять в нескольких
        компаниях. Поля статуса проверки и владельца передавать нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyInput'
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Компания с указанным ИНН уже существует (company_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listMyCompanies
      summary: Мои компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: 'Только активные членства. Порядок: сначала новые, затем UUID по убыванию.'
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyList'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCompany
      summary: Профиль моей компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCompany
      summary: Обновить профиль компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Только owner. Параллельные запросы не затирают поля, которые не передавались в PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Компания с указанным ИНН уже существует (company_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCompanyFiles
      summary: Документы и логотипы компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Для активных участников компании. Удалённые файлы не возвращаются. Старые логотипы остаются в списке до явного удаления.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFileList'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: uploadCompanyFile
      summary: Загрузить документ или установить логотип
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только owner. Ровно один file и один purpose. Документы: PDF/JPEG/PNG до 10 МиБ. Логотип: JPEG/PNG до 2 МиБ. Изображения — до 4
        мегапикселей. Тип определяется по содержимому. company_logo автоматически заменяет logo_file_id после успешной загрузки. Бакет
        приватный; скачивание через API с Bearer. Это проверка формата, а не антивирус.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum:
                    - company_document
                    - company_logo
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFile'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен допустимый размер файла (file_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Неподдерживаемый тип файла (unsupported_file_type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files/{file_id}/download:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadCompanyFile
      summary: Скачать приватный файл компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только активные участники этой компании. В браузере используйте fetch с Authorization и blob; ключ S3 клиенту не нужен. PDF
        возвращается как attachment, логотип — inline. Cache-Control: private, no-store.
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Имя файла и способ отображения
            Cache-Control:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files/{file_id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCompanyFile
      summary: Удалить документ или логотип
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только owner. Сначала закрывается скачивание и сбрасывается logo_file_id, затем удаляется объект S3. При сбое вернётся 503: повторите
        DELETE. Повторное удаление доступного владельцу файла возвращает 204.
      responses:
        '204':
          description: Файл удалён
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    keycloakOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __OIDC_ISSUER__/protocol/openid-connect/auth
          tokenUrl: __OIDC_ISSUER__/protocol/openid-connect/token
          scopes:
            openid: OIDC-идентичность
            profile: Профиль
            email: Подтверждённый email
  schemas:
    CompanyInput:
      type: object
      additionalProperties: false
      required:
        - name
        - contact_email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: ФСП Технологии
        description:
          type: string
          nullable: true
          maxLength: 10000
        inn:
          type: string
          nullable: true
          pattern: ^([0-9]{10}|[0-9]{12})$
          description: Необязательный уникальный ИНН. Проверяется контрольная сумма; пустая строка очищает поле.
          example: '7707083893'
        contact_email:
          type: string
          format: email
          maxLength: 254
          example: hr@example.org
        contact_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Контактная ссылка http или https, без логина и пароля.
    CompanyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Передавайте только изменяемые поля. null очищает description, inn и contact_url. name и contact_email очистить нельзя. Логотип задаётся
        загрузкой файла с purpose=company_logo.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: ФСП Технологии
        description:
          type: string
          nullable: true
          maxLength: 10000
        inn:
          type: string
          nullable: true
          pattern: ^([0-9]{10}|[0-9]{12})$
          description: Необязательный уникальный ИНН. Проверяется контрольная сумма; пустая строка очищает поле.
          example: '7707083893'
        contact_email:
          type: string
          format: email
          maxLength: 254
          example: hr@example.org
        contact_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Контактная ссылка http или https, без логина и пароля.
    Company:
      type: object
      required:
        - id
        - name
        - description
        - inn
        - contact_email
        - contact_url
        - logo_file_id
        - verification_status
        - created_at
        - member_role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: ФСП Технологии
        description:
          type: string
          nullable: true
          maxLength: 10000
        inn:
          type: string
          nullable: true
          pattern: ^([0-9]{10}|[0-9]{12})$
          description: Необязательный уникальный ИНН. Проверяется контрольная сумма; пустая строка очищает поле.
          example: '7707083893'
        contact_email:
          type: string
          format: email
          maxLength: 254
          example: hr@example.org
        contact_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Контактная ссылка http или https, без логина и пароля.
        logo_file_id:
          type: string
          format: uuid
          nullable: true
        verification_status:
          type: string
          enum:
            - unverified
            - pending
            - verified
            - rejected
          description: При создании unverified. Через профиль менять нельзя.
        created_at:
          type: string
          format: date-time
        member_role:
          type: string
          enum:
            - owner
            - recruiter
            - viewer
    CompanyFile:
      type: object
      required:
        - id
        - purpose
        - original_name
        - media_type
        - size_bytes
        - checksum_sha256
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
            - company_document
            - company_logo
        original_name:
          type: string
        media_type:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        checksum_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
            - pending
            - ready
            - deleting
            - deleted
          description: Скачать можно только ready. pending/deleting после сбоя можно удалить повторным DELETE.
        created_at:
          type: string
          format: date-time
    CompanyList:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        limit:
          type: integer
        offset:
          type: integer
    CompanyFileList:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyFile'
        limit:
          type: integer
        offset:
          type: integer
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    CurrentUser:
      type: object
      required:
        - id
        - sub
        - email
        - email_verified
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
          description: Идентификатор пользователя в Keycloak
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum:
            - candidate
            - employer
            - admin
        status:
          type: string
          enum:
            - active
            - blocked
            - deleted
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
              description: Понятное сообщение об ошибке на русском языке
              example: Маршрут не найден
  responses:
    Unauthorized:
      description: Нет валидного токена или email не подтверждён (unauthorized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthUnavailable:
      description: OIDC не настроен (auth_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Healthy:
      description: Сервис доступен
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Идентификатор запроса в логах
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
