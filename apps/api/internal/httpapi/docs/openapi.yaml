      - name: need_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: recommendCandidatesForNeed
      summary: Предварительная подборка по условиям потребности
      tags: [Банк кандидатов]
      description: "Только активная потребность этой компании. Несовместимые форматы и известные ожидания выше salary_to_rub исключаются. Неизвестная зарплата допускается, если не задан явный salary_max_rub. Дополнительные фильтры сужают подборку. Сортировка по числу совпадений формата, бюджета, города и часового пояса по убыванию, затем по UUID по возрастанию; пагинация после сортировки. Это подбор условий работы, а не квалификации: специализация, подтверждённый грейд, навыки, результаты тестов и достижения ФСП пока не оцениваются."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
        - name: work_format_ids
          in: query
          description: "До 10 уникальных ID из справочника. Подходит любой выбранный формат. Передавать один параметр через запятую, например 1,3."
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items: {type: integer, minimum: 1, maximum: 32767}
        - name: experience_min_months
          in: query
          description: Минимальный стаж в месяцах включительно
          schema: {type: integer, minimum: 0, maximum: 600}
        - name: experience_max_months
          in: query
          description: Максимальный стаж в месяцах включительно; не меньше минимального
          schema: {type: integer, minimum: 0, maximum: 600}
        - name: salary_max_rub
          in: query
          description: "Максимальные зарплатные ожидания в рублях за месяц включительно. При явном фильтре профили без зарплатных ожиданий исключаются."
          schema: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateRecommendationPage'
        '400':
          $ref: '#/components/responses/CandidateBankBadRequest'
        '401':
