openapi: 3.0.3
info:
  title: ФСП API
  version: 0.1.0
  description: Основа API. Продуктовые методы добавляются по мере реализации.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: liveness
      summary: Проверка процесса API
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /readyz:
    get:
      operationId: readiness
      summary: Доступность Postgres, Redis и S3-бакета
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Информация об API
      responses:
        '200':
          description: Версия сервиса
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - version
                properties:
                  name:
                    type: string
                    example: fsp-api
                  version:
                    type: string
                    example: 0.1.0
  /api/v1/me:
    get:
      operationId: getIdentity
      summary: Проверенная OIDC-идентичность текущего пользователя
      description: Требуется JWT access token с audience API и подтверждённым email. Локальная роль пока не возвращается.
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Идентичность из токена
          content:
            application/json:
              schema:
                type: object
                required:
                  - sub
                  - email
                  - email_verified
                properties:
                  sub:
                    type: string
                  email:
                    type: string
                    format: email
                  email_verified:
                    type: boolean
        '401':
          description: Нет валидного токена или email не подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: OIDC не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Публичная конфигурация входа через Keycloak
      responses:
        '200':
          description: Настройки SPA
          content:
            application/json:
              schema:
                type: object
                required:
                  - issuer
                  - client_id
                properties:
                  issuer:
                    type: string
                    format: uri
                  client_id:
                    type: string
                    example: fsp-web
        '503':
          description: Авторизация не настроена
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    keycloakOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __OIDC_ISSUER__/protocol/openid-connect/auth
          tokenUrl: __OIDC_ISSUER__/protocol/openid-connect/token
          scopes:
            openid: OIDC-идентичность
            profile: Профиль
            email: Подтверждённый email
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
              description: Понятное сообщение об ошибке на русском языке
              example: Маршрут не найден
  responses:
    Healthy:
      description: Сервис доступен
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Идентификатор запроса в логах
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
