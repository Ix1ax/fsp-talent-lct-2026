      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCompany
      summary: Обновить профиль компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Только owner. Параллельные запросы не затирают поля, которые не передавались в PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Компания с указанным ИНН уже существует (company_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCompanyFiles
      summary: Документы и логотипы компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Для активных участников компании. Удалённые файлы не возвращаются. Старые логотипы остаются в списке до явного удаления.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFileList'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: uploadCompanyFile
      summary: Загрузить документ или установить логотип
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только owner. Ровно один file и один purpose. Документы: PDF/JPEG/PNG до 10 МиБ. Логотип: JPEG/PNG до 2 МиБ. Изображения — до 4
        мегапикселей. Тип определяется по содержимому. company_logo автоматически заменяет logo_file_id после успешной загрузки. Бакет
        приватный; скачивание через API с Bearer. Это проверка формата, а не антивирус.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum:
                    - company_document
                    - company_logo
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFile'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен допустимый размер файла (file_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Неподдерживаемый тип файла (unsupported_file_type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files/{file_id}/download:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadCompanyFile
      summary: Скачать приватный файл компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только активные участники этой компании. В браузере используйте fetch с Authorization и blob; ключ S3 клиенту не нужен. PDF
        возвращается как attachment, логотип — inline. Cache-Control: private, no-store.
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Имя файла и способ отображения
            Cache-Control:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files/{file_id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCompanyFile
      summary: Удалить документ или логотип
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только owner. Сначала закрывается скачивание и сбрасывается logo_file_id, затем удаляется объект S3. При сбое вернётся 503: повторите
        DELETE. Повторное удаление доступного владельцу файла возвращает 204.
      responses:
        '204':
          description: Файл удалён
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/needs:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createEmployerNeed
      summary: Создать потребность работодателя
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Owner или recruiter этой компании. По умолчанию draft. Статус active требует навыки и форматы работы. Все связи создаются одной
        транзакцией. created_by берётся из локального пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeedInput'
      responses:
        '201':
          description: Потребность создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerNeed'
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NeedsForbidden'
        '404':
          $ref: '#/components/responses/NeedsNotFound'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
    get:
      operationId: listEmployerNeeds
      summary: Потребности моей компании
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
