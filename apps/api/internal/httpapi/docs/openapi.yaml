            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен допустимый размер запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис админки или справочников не настроен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/catalogs/skills/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rejectAdminSkill
      summary: Отклонить навык и убрать его из резюме и потребностей
      tags: [Админские справочники]
      security:
        - adminSession: []
      description: >-
        Доступно для pending и approved. Причина обязательна. Все связи с резюме и потребностями удаляются одной транзакцией. Активная потребность, потерявшая последний навык, становится черновиком. Запись остаётся rejected, повторное предложение того же названия блокируется.
        Действие записывается в аудит. Повторное несовместимое действие возвращает 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSkillRejectInput'
      responses:
        '200':
          description: Карточка после модерации и число затронутых связей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSkillModerationResult'
        '400':
          description: Некорректный ID, причина или целевой навык.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужна действующая сессия админки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав администратора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Навык не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Действие недоступно для текущего статуса либо цель объединения не одобрена или архивирована.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен допустимый размер запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис админки или справочников не настроен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/catalogs/skills/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: mergeAdminSkill
      summary: Объединить навык с одобренной записью
      tags: [Админские справочники]
      security:
        - adminSession: []
      description: >-
        Исходный навык должен быть pending или approved, цель — другой approved и active. Связи переносятся атомарно. При дубле в резюме сохраняется большая самооценка; в потребности — обязательность любого из дублей и больший вес. Старое название ведёт к каноническому навыку, цепочки объединений сокращаются до одной ссылки.
        Действие записывается в аудит. Повторное несовместимое действие возвращает 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSkillMergeInput'
      responses:
        '200':
          description: Карточка после модерации и число затронутых связей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSkillModerationResult'
        '400':
          description: Некорректный ID, причина или целевой навык.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужна действующая сессия админки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав администратора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Навык не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Действие недоступно для текущего статуса либо цель объединения не одобрена или архивирована.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен допустимый размер запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис админки или справочников не настроен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    AdminCatalogKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [specializations, skills, grades, work_formats]
  securitySchemes:
    adminSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Отдельный токен админки из /api/v1/admin/auth/login; токены Keycloak не подходят
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    keycloakOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __OIDC_ISSUER__/protocol/openid-connect/auth
          tokenUrl: __OIDC_ISSUER__/protocol/openid-connect/token
          scopes:
            openid: OIDC-идентичность
            profile: Профиль
            email: Подтверждённый email
  schemas:
    AdminSkillApproveInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
    AdminSkillRejectInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    AdminSkillMergeInput:
      type: object
      additionalProperties: false
      required: [target_id]
      properties:
        target_id:
          type: string
          format: uuid
          description: Другая одобренная и активная запись skills.
        reason:
          type: string
          maxLength: 1000
    AdminSkillModerationResult:
      type: object
      required: [skill, candidate_links, need_links, drafted_needs]
      properties:
        skill:
          $ref: '#/components/schemas/AdminCatalogItem'
        candidate_links:
          type: integer
          minimum: 0
          description: Количество перенесённых или удалённых связей с резюме.
        need_links:
          type: integer
          minimum: 0
          description: Количество перенесённых или удалённых связей с потребностями.
        drafted_needs:
          type: integer
          minimum: 0
          description: Количество активных потребностей, ставших черновиками после отклонения последнего навыка.
    AdminCatalogItem:
      type: object
      required: [id, code, name, active]
      properties:
        submitted_by:
          type: string
          format: uuid
          description: Автор предложения, если известен. Только для навыков.
        submitted_at:
          type: string
          format: date-time
        moderated_by:
          type: string
          format: uuid
          description: ID админского аккаунта, принявшего последнее решение.
        moderated_at:
          type: string
          format: date-time
        moderation_reason:
          type: string
          maxLength: 1000
        merged_into:
          type: string
          format: uuid
          description: Канонический навык для записи со статусом merged.
        id:
          type: string
          description: UUID навыка или числовой ID, возвращённый строкой.
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
        rank:
          type: integer
          description: Только для грейдов. Неизменяемый порядок уровня.
        aliases:
          type: array
          items:
            type: string
        moderation_status:
          type: string
          enum: [approved, pending, rejected, merged]
          description: Только для навыков. Одобрение записи не подтверждает уровень кандидата.
    AdminCatalogPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCatalogItem'
        limit:
          type: integer
        offset:
          type: integer
    AdminCatalogCreateInput:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_-]*$'
          maxLength: 64
          description: Для грейдов и форматов работы максимум 32 символа.
        name:
          type: string
          minLength: 1
          maxLength: 200
        rank:
          type: integer
          minimum: 1
          maximum: 32767
          description: Обязателен только для грейда, для остальных справочников запрещён.
        aliases:
          type: array
          maxItems: 30
          description: Только для навыков.
          items:
            type: string
            minLength: 1
            maxLength: 200
    AdminCatalogUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        active:
          type: boolean
          description: false — архивировать, true — восстановить.
        aliases:
          type: array
          maxItems: 30
          description: Только для навыков. Пустой массив очищает альтернативные названия.
          items:
            type: string
            minLength: 1
            maxLength: 200
    AdminCredentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, writeOnly: true}
    AdminCreateInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password:
          type: string
          format: password
          writeOnly: true
          description: От 12 до 72 байт UTF-8; пароль не обрезается и не нормализуется
    AdminAccount:
      type: object
      required: [id, email, role, status, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {type: string, enum: [superadmin, admin]}
        status: {type: string, enum: [active, blocked]}
        created_at: {type: string, format: date-time}
    AdminLogin:
      type: object
      required: [access_token, token_type, expires_at, admin]
      properties:
        access_token:
          type: string
          description: Случайный непрозрачный токен; в БД хранится только SHA-256. Передавать в Authorization Bearer
        token_type: {type: string, enum: [Bearer]}
        expires_at: {type: string, format: date-time}
        admin: {$ref: '#/components/schemas/AdminAccount'}
    AdminAccountPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminAccount'}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
    CandidateBankCard:
      type: object
      description: "Безопасная карточка. ID относится к candidate_profiles, а не users или Keycloak. Контакты и свободное описание отсутствуют."
      required: [id, city, timezone, experience_months, salary_min_rub, search_status, work_format_ids]
      properties:
        id: {type: string, format: uuid}
        city: {type: string, nullable: true, maxLength: 200}
        timezone: {type: string, nullable: true, maxLength: 64}
        experience_months: {type: integer, minimum: 0, maximum: 600}
        salary_min_rub: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000}
        search_status: {type: string, enum: [open, passive]}
        work_format_ids:
          type: array
          items: {type: integer, minimum: 1}
      example:
        id: a76cb614-f634-41d6-9d19-76874fbcc842
        city: Москва
        timezone: Europe/Moscow
        experience_months: 36
        salary_min_rub: 180000
        search_status: open
        work_format_ids: [3]
    CandidateBankPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateBankCard'}
        total:
          type: integer
          format: int64
          minimum: 0
          description: Число доступных профилей после фильтрации до пагинации
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
    CandidateRecommendation:
      allOf:
        - $ref: '#/components/schemas/CandidateBankCard'
        - type: object
          required: [matched_conditions, reasons, unknown_conditions]
          properties:
            matched_conditions:
              type: integer
              minimum: 0
              maximum: 4
              description: Количество совпавших условий; не процент пригодности и не оценка квалификации
            reasons:
              type: array
              items: {type: string}
              example: [Совпадает формат работы, Зарплатные ожидания укладываются в бюджет]
            unknown_conditions:
              type: array
              description: "Не хватает значения кандидата или условия потребности. Известное несовпадение не включается в этот список."
              items:
                type: string
                enum: [work_format, salary, city, timezone]
    CandidateRecommendationPage:
      type: object
      required: [items, total, limit, offset, need_id, matching_mode, unassessed_criteria]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateRecommendation'}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
        need_id: {type: string, format: uuid}
        matching_mode:
          type: string
          enum: [conditions_only]
          description: Предварительная подборка только по условиям работы
        unassessed_criteria:
          type: array
          description: Критерии квалификации, которые пока не оцениваются
          items:
            type: string
            enum: [specialization, confirmed_grade, skills, test_results, fsp_achievements]
          example: [specialization, confirmed_grade, skills, test_results, fsp_achievements]
    CandidateOfferInput:
      type: object
      additionalProperties: false
      required: [candidate_id, title, description, salary_from_rub, salary_to_rub, contact_email]
      properties:
        candidate_id:
          type: string
          format: uuid
          description: UUID профиля candidate_profiles.id, не users.id и не Keycloak sub.
        need_id:
          type: string
          format: uuid
          nullable: true
          description: Необязательная активная потребность этой компании.
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 10000}
        salary_from_rub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: Нижняя граница месячной зарплаты в рублях, не выше salary_to_rub.
        salary_to_rub:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: Верхняя граница месячной зарплаты в рублях. Равенство границ означает фиксированную зарплату.
        contact_email:
          type: string
          format: email
          maxLength: 254
          description: Контакт работодателя без имени получателя.
        contact_url:
          type: string
          maxLength: 2048
          nullable: true
          description: Необязательный HTTP(S)-адрес связи с работодателем без логина и пароля. Пустая строка превращается в null.
      example:
        candidate_id: 00000000-0000-4000-8000-000000000001
        title: Go-разработчик
        description: Разработка сервисов в продуктовой команде.
        salary_from_rub: 150000
        salary_to_rub: 250000
        contact_email: hr@example.org
        contact_url: https://example.org/team
    CandidateOfferResponseInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [accepted, rejected]}
      example: {status: accepted}
    CandidateOffer:
      type: object
      required: [id, company_id, candidate_id, created_by, need_id, company_name, title, description, salary_from_rub, salary_to_rub, contact_email, contact_url, status, created_at, viewed_at, responded_at]
      description: Сохранённые условия предложения. Контактов кандидата нет, включая принятые предложения.
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        candidate_id:
          type: string
          format: uuid
          description: UUID профиля кандидата.
        created_by:
          type: string
          format: uuid
          description: Локальный UUID работодателя, отправившего предложение.
        need_id: {type: string, format: uuid, nullable: true}
        company_name:
          type: string
          description: Название компании на момент отправки.
        title: {type: string}
        description: {type: string}
        salary_from_rub: {type: integer, format: int64}
        salary_to_rub: {type: integer, format: int64}
        contact_email:
          type: string
          format: email
          description: Email работодателя, сохранённый при отправке.
        contact_url: {type: string, nullable: true}
        status: {type: string, enum: [sent, viewed, accepted, rejected]}
        created_at: {type: string, format: date-time}
        viewed_at: {type: string, format: date-time, nullable: true}
        responded_at: {type: string, format: date-time, nullable: true}
    CandidateOfferPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandidateOffer'
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
    CompanyMember:
      type: object
      required: [company_id, user_id, role, status, joined_at]
      properties:
        company_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        role: {type: string, enum: [owner, recruiter, viewer]}
        status: {type: string, enum: [active, inactive]}
        joined_at: {type: string, format: date-time}
    CompanyMemberRoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {type: string, enum: [recruiter, viewer]}
    CompanyInvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {type: string, format: email, maxLength: 254}
        role: {type: string, enum: [recruiter, viewer]}
    CompanyInvitationAcceptInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
    CompanyInvitation:
      type: object
      required: [id, company_id, email, role, status, created_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        company_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {type: string, enum: [recruiter, viewer]}
        status: {type: string, enum: [pending, accepted, revoked, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        token:
          type: string
          description: Только в ответе создания. Используется получателем в POST /api/v1/company-invitations/accept.
    CompanyMemberPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyMember'
        limit: {type: integer}
        offset: {type: integer}
    CompanyInvitationPage:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyInvitation'
        limit: {type: integer}
        offset: {type: integer}
    NeedInput:
      type: object
      additionalProperties: false
      required:
        - specialization_id
        - title
        - description
      properties:
        specialization_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        grade_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Go-разработчик в платформенную команду
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Кого ищем, задачи, условия и описание команды.
        salary_from_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
          description: Рубли в месяц. Не больше salary_to_rub.
        salary_to_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
        city:
          type: string
          nullable: true
          maxLength: 200
        timezone:
          type: string
          nullable: true
          maxLength: 64
          example: Europe/Moscow
          description: Часовой пояс IANA; Local не принимается.
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          default: draft
        skills:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - skill_id
              - weight
            properties:
              skill_id:
                type: string
                format: uuid
              required:
                type: boolean
                default: false
                description: Обязателен ли навык для подбора.
              weight:
                type: number
                minimum: 0.01
                maximum: 100
                multipleOf: 0.01
                example: 1
          description: Не допускаются повторные skill_id. Для active нужен хотя бы один навык.
        work_format_ids:
          type: array
          maxItems: 10
          uniqueItems: true
