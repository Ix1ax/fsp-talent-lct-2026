          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис не настроен (candidate_unavailable, avatar_unavailable) или хранилище файлов недоступно (storage_unavailable, upload_busy).
          content:
            application/json:
