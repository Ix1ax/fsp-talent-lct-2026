name: fsp
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
      - sh
      - "-c"
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
        --appendonly no
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.37
    command:
      - mini
      - "-dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
    ports:
      - 127.0.0.1:8333:8333
    volumes:
      - s3-data:/data
  migrate:
    build: ./apps/api
    entrypoint:
      - migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - app
  api:
    build: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      OIDC_ISSUER: http://localhost:8180/realms/fsp
      OIDC_CLIENT_ID: fsp-api
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/fsp
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - 127.0.0.1:8080:8080
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "-O"
        - /dev/null
        - http://127.0.0.1:8080/readyz
      interval: 5s
      timeout: 4s
      retries: 30
    profiles:
      - app
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - 127.0.0.1:3000:80
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - app
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-db-change-me}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 192m
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - 127.0.0.1:8025:8025
    mem_limit: 64m
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start
      - "--import-realm"
      - "--cache=local"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-local-keycloak-db-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-keycloak-admin-change-me}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
      API_PUBLIC_URL: http://localhost:8080
      WEB_PUBLIC_URL: http://localhost:3000
    ports:
      - 127.0.0.1:8180:8080
    volumes:
      - ./infra/keycloak/local:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection:
          close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
volumes:
  postgres-data: null
  s3-data: null
  keycloak-data: null
