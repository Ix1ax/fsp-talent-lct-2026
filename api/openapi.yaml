            - email
      description: "Создаёт попытку по паре специализация и грейд: выбирает случайные задания по составу шаблона и фиксирует их снимок, запускает таймер. Правила проверки и правильные ответы не возвращаются. Нужны профиль и активное согласие processing. Одновременно может быть одна активная попытка."
      requestBody:
        required: true
        content:
          application/json:
