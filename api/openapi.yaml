            schema:
              $ref: '#/components/schemas/AdminVerificationDecision'
  /api/v1/admin/companies/{company_id}/status:
    patch:
      operationId: changeCompanyAccessStatus
      tags:
        - Операции админки
      summary: Заблокировать или разблокировать компанию
      description: >-
        Admin и superadmin. active/blocked, обязательная причина до 2000 символов.
        Блокировка закрывает все рабочие методы компании каждому участнику, включая документы,
        приглашения, поиск кандидатов, предложения, потребности, задания, решения и запрос подтверждения.
        Компания сохраняется в списке и собственной карточке с причиной блокировки.
        Её задания и офферы недоступны кандидатам; принятие оффера и отправка решения запрещены.
        Данные, подтверждение и членство сохраняются. Разблокировка не снимает отдельные блокировки пользователей.
        Повтор текущего статуса не меняет причину/дату и не создаёт событие аудита.
      security:
        - adminSession: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusInput'
      responses:
        '200':
          description: Актуальная карточка компании.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCompany'
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '500':
          $ref: '#/components/responses/AdminOperations500'
  /api/v1/admin/users/{id}/status:
    patch:
      operationId: changeApplicationUserStatus
      tags:
        - Операции админки
      summary: Блокировать или включить пользователя
      description: >-
        Admin и superadmin. Нужна причина. Изменение users.role=admin доступно только superadmin; deleted не
        восстанавливается. Блокировка действует для API немедленно; роли, профиль и Keycloak не изменяются. Повтор того же
        статуса не создаёт события. Причина и дата текущей блокировки возвращаются в карточке администратора и GET /me.
        При active эти поля очищаются; прежние причины остаются в аудите.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '409':
          $ref: '#/components/responses/AdminOperations409'
        '413':
          $ref: '#/components/responses/AdminOperations413'
        '500':
          $ref: '#/components/responses/AdminOperations500'
        '503':
          $ref: '#/components/responses/AdminOperations503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserStatusInput'
  /api/v1/admin/needs/{id}/moderation:
    patch:
      operationId: moderateEmployerNeed
      tags:
        - Операции админки
      summary: Скрыть потребность или снять модерацию
      description: >-
        Admin и superadmin. hidden архивирует потребность и блокирует редактирование работодателем. published снимает
        запрет, сохраняя archived; работодатель может актуализировать потребность обычным API. Нужна причина; повтор не
        создаёт событие.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNeed'
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '409':
          $ref: '#/components/responses/AdminOperations409'
        '413':
          $ref: '#/components/responses/AdminOperations413'
        '500':
          $ref: '#/components/responses/AdminOperations500'
        '503':
          $ref: '#/components/responses/AdminOperations503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContentModerationInput'
  /api/v1/admin/tasks/{id}/moderation:
    patch:
      operationId: moderateCompanyDailyTask
      tags:
        - Операции админки
      summary: Скрыть ежедневное задание или восстановить видимость
      description: >-
        Admin и superadmin. hidden закрывает приём и скрывает карточку/файл от кандидатов; история их собственных ответов
        сохраняется. Компания видит своё задание. published восстанавливает видимость, сохраняя closed. Квота дня не
        освобождается. Нужна причина.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCompanyTask'
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '409':
          $ref: '#/components/responses/AdminOperations409'
        '413':
          $ref: '#/components/responses/AdminOperations413'
        '500':
          $ref: '#/components/responses/AdminOperations500'
        '503':
          $ref: '#/components/responses/AdminOperations503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminContentModerationInput'
  /api/v1/admin/tasks/{id}/file:
    get:
      operationId: downloadAdminDailyTaskFile
      tags:
        - Операции админки
      summary: Скачать файл ежедневного задания
      description: Admin и superadmin. Скачивается файл задания; доступ к приватным файлам решений кандидатов не добавляется.
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Приватный файл, attachment, nosniff; Cache-Control: private, no-store.'
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '409':
          $ref: '#/components/responses/AdminOperations409'
        '413':
          $ref: '#/components/responses/AdminOperations413'
        '500':
          $ref: '#/components/responses/AdminOperations500'
        '503':
          $ref: '#/components/responses/AdminOperations503'
  /api/v1/companies/{company_id}/verification:
    get:
      operationId: getMyCompanyVerification
      tags:
        - Проверка компаний
      summary: Статус заявки компании на подтверждение
      description: Любой активный участник компании с employer JWT. Причина отказа и ID документов заявки доступны компании.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyVerification'
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '409':
          $ref: '#/components/responses/AdminOperations409'
        '413':
          $ref: '#/components/responses/AdminOperations413'
        '500':
          $ref: '#/components/responses/AdminOperations500'
        '503':
          $ref: '#/components/responses/AdminOperations503'
  /api/v1/companies/{company_id}/verification/request:
    post:
      operationId: requestMyCompanyVerification
      tags:
        - Проверка компаний
      summary: Подать компанию на подтверждение
      description: >-
        Только активный владелец компании. Нужен ИНН и хотя бы один ready company_document; отсутствие — 409. Фиксируются
        документы, время и новая версия заявки. Повтор pending/verified возвращает текущее состояние без нового события.
        Подтверждение не является обязательным условием работы MVP по ТЗ.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyVerification'
        '400':
          $ref: '#/components/responses/AdminOperations400'
        '401':
          $ref: '#/components/responses/AdminOperations401'
        '403':
          $ref: '#/components/responses/AdminOperations403'
        '404':
          $ref: '#/components/responses/AdminOperations404'
        '409':
          $ref: '#/components/responses/AdminOperations409'
        '413':
          $ref: '#/components/responses/AdminOperations413'
        '500':
          $ref: '#/components/responses/AdminOperations500'
        '503':
          $ref: '#/components/responses/AdminOperations503'
components:
  parameters:
    AdminCatalogKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [specializations, skills, grades, work_formats]
  securitySchemes:
    adminSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Отдельный токен админки из /api/v1/admin/auth/login; токены Keycloak не подходят
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    keycloakOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __OIDC_ISSUER__/protocol/openid-connect/auth
          tokenUrl: __OIDC_ISSUER__/protocol/openid-connect/token
          scopes:
            openid: OIDC-идентичность
            profile: Профиль
            email: Подтверждённый email
  schemas:
    AdminCompany:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - inn
        - contact_email
        - contact_url
        - logo_file_id
        - verification_status
        - verification_version
        - verification_requested_at
        - verification_reviewed_at
        - verification_reviewed_by
        - verification_reason
        - verification_document_ids
        - created_at
        - status
        - blocked_reason
        - blocked_at
      properties:
        status:
          type: string
          enum: [active, blocked]
          description: Статус доступа, независимый от verification_status.
        blocked_reason:
          $ref: '#/components/schemas/BlockReason'
        blocked_at:
          $ref: '#/components/schemas/BlockTime'
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        inn:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
        contact_url:
          type: string
          nullable: true
        logo_file_id:
          type: string
          format: uuid
          nullable: true
        verification_status:
          type: string
          enum:
            - unverified
            - pending
            - verified
            - rejected
        verification_version:
          type: integer
          minimum: 0
        verification_requested_at:
          type: string
          format: date-time
          nullable: true
        verification_reviewed_at:
          type: string
          format: date-time
          nullable: true
        verification_reviewed_by:
          type: string
          format: uuid
          nullable: true
        verification_reason:
          type: string
          nullable: true
        verification_document_ids:
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
    CompanyVerification:
      type: object
      additionalProperties: false
      required:
        - company_id
        - status
        - version
        - requested_at
        - reviewed_at
        - reason
        - document_ids
      properties:
        company_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - unverified
            - pending
            - verified
            - rejected
        version:
          type: integer
          minimum: 0
        requested_at:
          type: string
          format: date-time
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
        document_ids:
          type: array
          items:
            type: string
            format: uuid
    AdminVerificationDecision:
      type: object
      additionalProperties: false
      required:
        - status
        - expected_version
      properties:
        status:
          type: string
          enum:
            - verified
            - rejected
            - unverified
        expected_version:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 2000
      description: >-
        verified/rejected только для pending. unverified отзывает verified. Причина обязательна для отказа/отзыва.
        expected_version берётся из verification_version; устаревшая версия — 409.
    AdminUser:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - status
        - created_at
        - updated_at
        - candidate_profile_id
        - search_status
        - blocked_reason
        - blocked_at
      properties:
        blocked_reason:
          $ref: '#/components/schemas/BlockReason'
        blocked_at:
          $ref: '#/components/schemas/BlockTime'
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - candidate
            - employer
            - admin
        status:
          type: string
          enum:
            - active
            - blocked
            - deleted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        candidate_profile_id:
          type: string
          format: uuid
          nullable: true
        search_status:
          type: string
          enum:
            - open
            - passive
            - hidden
          nullable: true
    AdminUserStatusInput:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum:
            - active
            - blocked
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    AdminContentModerationInput:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum:
            - published
            - hidden
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      description: >-
        hidden скрывает задание и закрывает приём / архивирует потребность. published снимает модерацию; статус
        closed/archived сохраняется.
    AdminNeed:
      type: object
      required:
        - id
        - company_id
        - created_by
        - specialization_id
        - grade_id
        - title
        - description
        - salary_from_rub
        - salary_to_rub
        - city
        - timezone
        - status
        - skills
        - work_format_ids
        - created_at
        - moderation_status
        - company_name
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        specialization_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        grade_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Go-разработчик в платформенную команду
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Кого ищем, задачи, условия и описание команды.
        salary_from_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
          description: Рубли в месяц. Не больше salary_to_rub.
        salary_to_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
        city:
          type: string
          nullable: true
          maxLength: 200
        timezone:
          type: string
          nullable: true
          maxLength: 64
          example: Europe/Moscow
          description: Часовой пояс IANA; Local не принимается.
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          default: draft
        skills:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - skill_id
              - weight
            properties:
              skill_id:
                type: string
                format: uuid
              required:
                type: boolean
                default: false
                description: Обязателен ли навык для подбора.
              weight:
                type: number
                minimum: 0.01
                maximum: 100
                multipleOf: 0.01
                example: 1
          description: Не допускаются повторные skill_id. Для active нужен хотя бы один навык.
        work_format_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 32767
          description: ID форматов из GET /api/v1/catalogs. Для active нужен хотя бы один формат.
        created_at:
          type: string
          format: date-time
        moderation_status:
          type: string
          enum:
            - published
            - hidden
        company_name:
          type: string
    AdminOffer:
      type: object
      required:
        - id
        - company_id
        - candidate_id
        - created_by
        - need_id
        - company_name
        - title
        - description
        - salary_from_rub
        - salary_to_rub
        - status
        - created_at
        - viewed_at
        - responded_at
      description: Сохранённые условия предложения. Контактов кандидата нет, включая принятые предложения.
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
          description: UUID профиля кандидата.
        created_by:
          type: string
          format: uuid
          description: Локальный UUID работодателя, отправившего предложение.
        need_id:
          type: string
          format: uuid
          nullable: true
        company_name:
          type: string
          description: Название компании на момент отправки.
        title:
          type: string
        description:
          type: string
        salary_from_rub:
          type: integer
          format: int64
        salary_to_rub:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - sent
            - viewed
            - accepted
            - rejected
        created_at:
          type: string
          format: date-time
        viewed_at:
          type: string
          format: date-time
          nullable: true
        responded_at:
          type: string
          format: date-time
          nullable: true
    AdminCompanyTask:
      type: object
      additionalProperties: false
      required:
        - id
        - company_id
        - company_name
        - title
        - description
        - specialization_id
        - grade_id
        - deadline_at
        - file
        - status
        - published_at
        - published_on
        - moderation_status
        - created_by
        - submissions_count
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        company_name:
          type: string
        title:
          type: string
        description:
          type: string
        specialization_id:
          type: integer
          minimum: 1
          maximum: 32767
          nullable: true
        grade_id:
          type: integer
          minimum: 1
          maximum: 32767
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
        file:
          $ref: '#/components/schemas/CompanyTaskFile'
        status:
          type: string
          enum:
            - open
            - closed
        published_at:
          type: string
          format: date-time
        published_on:
          type: string
          format: date
          description: Дата публикации в Europe/Moscow.
        moderation_status:
          type: string
          enum:
            - published
            - hidden
        created_by:
          type: string
          format: uuid
        submissions_count:
          type: integer
          minimum: 0
      description: >-
        Административная карточка: status учитывает закрытие и истечение deadline. status фильтра списка означает moderation_status.
    AdminAssessmentAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - candidate_id
        - template_id
        - specialization_id
        - grade_id
        - stack_skill_id
        - stack_name
        - status
        - started_at
        - deadline_at
        - finished_at
        - time_limit_sec
        - pass_score
        - score_percent
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        specialization_id:
          type: integer
        grade_id:
          type: integer
        stack_skill_id:
          type: string
          format: uuid
          nullable: true
        stack_name:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - passed
            - failed
            - expired
        started_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        time_limit_sec:
          type: integer
        pass_score:
          type: number
        score_percent:
          type: number
          nullable: true
      description: >-
        Метаданные попытки без ответов и правил оценки. Статус хранится в БД; active с прошедшим deadline ожидает завершения
        обычным механизмом тестирования.
    AdminCompanyMember:
      type: object
      additionalProperties: false
      required:
        - company_id
