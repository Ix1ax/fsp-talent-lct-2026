    post:
      operationId: submitMySkill
      summary: Добавить навык по названию
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      description: >-
        Требуются профиль кандидата и действующая авторизация. Название, код и альтернативные названия
        проверяются без учёта регистра. Существующий навык переиспользуется; неизвестный создаётся как pending
        и прикрепляется к резюме одной транзакцией. Pending виден в личном списке, но не в публичном справочнике.
        Повторное предложение не создаёт дубликат. Максимум 50 навыков в резюме и 20 новых предложений за 24 часа.
        Архивированные и отклонённые навыки добавлять нельзя. Название объединённого навыка ведёт к канонической записи. Клиент не задаёт статус модерации.
