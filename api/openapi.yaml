      description: "Активный employer с членством owner или recruiter. candidate_id — UUID candidate_profiles.id. Получатель должен быть активным кандидатом с search_status open или passive. need_id необязателен; привязать можно только активную потребность этой компании. Обе границы зарплаты обязательны, в рублях за месяц. Название компании берётся из БД, автор — из текущего пользователя. Условия сохраняются на момент отправки. Каждый успешный POST создаёт новое предложение; автоматический повтор отправки не предусмотрен. Контакты кандидата не возвращаются, письмо и чат не подключены. Успешная отправка атомарно записывает просмотр и историю отправки этой компании; кандидат исключается из её обычной выдачи на 30 дней. Отказ или принятие не сбрасывают срок."
