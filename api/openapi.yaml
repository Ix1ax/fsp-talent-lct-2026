  /api/v1/me/consents:
    get:
      operationId: listMyConsents
      summary: История согласий кандидата и текущая версия политики
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Все согласия пользователя, новые первыми; активное имеет revoked_at null. Версию политики из current_policy_version нужно показать
        кандидату и вернуть при выдаче согласия.
      responses:
        '200':
          description: Согласия и текущая версия политики.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentList'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис согласий не настроен (consent_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: grantMyConsent
      summary: Дать согласие
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Виды: processing (обработка персональных данных), publication (публикация профиля), ats_transfer (передача в ATS конкретной компании,
        нужен company_id). Нужно передать текущую версию политики. Повторная выдача после отзыва создаёт новую запись.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrant'
      responses:
        '201':
          description: Согласие дано.
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/me/consents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        '400':
          description: Некорректный JSON, неизвестное поле, вид или company_id (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания для ats_transfer не найдена (company_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Согласие уже дано (consent_exists) или версия политики устарела (policy_outdated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Тело запроса больше 2 МиБ (request_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис согласий не настроен (consent_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/consents/{kind}:
    delete:
      operationId: revokeMyConsent
      summary: Отозвать активное согласие
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Отзыв processing отзывает все активные согласия кандидата, скрывает профиль (search_status hidden) и закрывает контакты;
        данные не удаляются. Отзыв publication скрывает профиль. Повторная выдача статус профиля не восстанавливает. Для ats_transfer
        обязателен параметр company_id, для остальных видов он не допускается.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - processing
              - publication
              - ats_transfer
        - name: company_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Согласие отозвано.
        '400':
          description: Неизвестный вид или неверное использование company_id (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Активное согласие не найдено (consent_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис согласий не настроен (consent_unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/contacts:
    put:
      operationId: putMyContacts
      summary: Сохранить свои контакты
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
