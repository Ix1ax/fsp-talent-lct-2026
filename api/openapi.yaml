  /api/v1/companies/{company_id}/tasks:
    post:
      operationId: publishCompanyDailyTask
      tags:
        - Задания компаний
      summary: Опубликовать ежедневное задание с файлом
      description: >-
        Владелец или рекрутер. Одна успешная публикация на компанию за календарный день Europe/Moscow; квота общая для
        сотрудников, другая компания независима. Закрытие задания квоту не освобождает; сбой загрузки не расходует квоту.
        Специализация и грейд — активные ID из /catalogs; deadline_at опционален и должен быть в будущем. Один непустой
        файл file до 10 МиБ: PDF, JPEG/PNG до 4 Мп, ZIP до 1000 записей и 100 МиБ суммарного заявленного размера, UTF-8
        TXT/MD без NUL. Тип проверяется по содержимому. Архив сохраняется без распаковки или исполнения; multipart до 10
        МиБ + 64 КиБ. Неизвестные и повторные поля запрещены.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDailyTask'
        '400':
          $ref: '#/components/responses/DailyTasks400'
        '401':
          $ref: '#/components/responses/DailyTasks401'
        '403':
          $ref: '#/components/responses/DailyTasks403'
        '404':
          $ref: '#/components/responses/DailyTasks404'
        '409':
          $ref: '#/components/responses/DailyTasks409'
        '413':
          $ref: '#/components/responses/DailyTasks413'
        '415':
          $ref: '#/components/responses/DailyTasks415'
        '500':
          $ref: '#/components/responses/DailyTasks500'
        '503':
          $ref: '#/components/responses/DailyTasks503'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyDailyTaskUpload'
    get:
      operationId: listCompanyDailyTasks
      tags:
        - Задания компаний
      summary: Список заданий своей компании
      description: >-
        Все активные участники компании, включая viewer. Новые публикации выше; при одинаковой дате ID DESC. status=all по
        умолчанию; истёкший deadline считается closed. company_id в фильтре только сужает область URL.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: company_id
          in: query
          schema:
            type: string
            format: uuid
        - name: specialization_id
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 32767
        - name: grade_id
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 32767
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Поиск подстроки в названии и описании без учёта регистра.
        - name: status
          in: query
          schema:
            type: string
            enum:
              - all
              - open
              - closed
            default: all
        - name: published_from
          in: query
          schema:
            type: string
            format: date
          description: Включительно, по дате МСК.
        - name: published_to
          in: query
          schema:
            type: string
            format: date
          description: Включительно, по дате МСК.
      responses:
