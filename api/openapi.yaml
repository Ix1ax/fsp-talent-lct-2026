                error:
                  code: unauthorized
                  message: Неверная почта, пароль или сессия
        '403':
          description: Недостаточно прав администратора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: Недостаточно прав для управления справочниками
        '404':
          description: Навык не найден.
