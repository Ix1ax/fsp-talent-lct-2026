      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Некорректное тело запроса (validation_error) или недопустимая роль (invalid_role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Пользователь уже зарегистрирован (already_registered)
          content:
            application/json:
              schema:
