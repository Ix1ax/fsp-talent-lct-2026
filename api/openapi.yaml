        category: {specialization_id: 1, grade_id: 2}
        id: a76cb614-f634-41d6-9d19-76874fbcc842
        city: Москва
        timezone: Europe/Moscow
        experience_months: 36
        salary_min_rub: 180000
        search_status: open
        work_format_ids: [3]
    CandidateBankDetails:
      allOf:
        - $ref: '#/components/schemas/CandidateBankCard'
        - type: object
          required: [qualifications, skills, assessment, experience, education, achievements]
          properties:
            qualifications:
              type: array
              description: Подтверждённые уровни по стекам; без ID попыток и ответов.
              items: {$ref: '#/components/schemas/CandidateCategory'}
