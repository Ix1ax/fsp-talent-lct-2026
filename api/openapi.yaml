        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateSkillSubmissionInput'
      responses:
        '200':
          description: Существующий или новый навык прикреплён к резюме; самооценка обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSkill'
