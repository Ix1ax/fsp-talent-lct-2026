        профиля ещё нет (тогда profile равен null): так фронт после входа строит онбординг одним запросом. Контакты видны только при
        активном согласии processing, иначе contacts равен null. В навыках показываются все навыки кандидата, в том числе ожидающие
        модерации. Готовность это подсказка: условия публикации (согласия processing и publication) проверяет сервер при смене
