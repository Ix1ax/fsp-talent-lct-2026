  /api/v1/admin/catalogs/skills/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: mergeAdminSkill
      summary: Объединить навык с одобренной записью
      tags: [Админские справочники]
      security:
        - adminSession: []
      description: >-
        Исходный навык должен быть pending или approved, цель — другой approved и active. Связи переносятся атомарно. При дубле в резюме сохраняется большая самооценка; в потребности — обязательность любого из дублей и больший вес. Старое название ведёт к каноническому навыку, цепочки объединений сокращаются до одной ссылки.
        Действие записывается в аудит. Повторное несовместимое действие возвращает 409.
