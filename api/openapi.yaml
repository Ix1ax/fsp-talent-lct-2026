                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentAttempt'
        '400':
          description: "Некорректное тело (validation_error)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: "Нужен действительный access token и подтверждённый email."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: "Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: "Профиль кандидата не создан (profile_not_found)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: "attempt_active (в error есть attempt_id), retake_cooldown или grade_change_cooldown (в error есть retry_at), already_confirmed, assessment_unavailable (нет опубликованного шаблона или не хватает заданий), consent_required."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentConflictError'
              examples:
                retake_cooldown:
                  value: {error: {code: retake_cooldown, message: "Пересдать этот тест можно позже", retry_at: "2026-10-14T12:00:00Z"}}
                attempt_active:
                  value: {error: {code: attempt_active, message: "У вас уже есть активная попытка тестирования", attempt_id: "11111111-1111-4111-8111-111111111111"}}
        '413':
          description: "Слишком большое тело (request_too_large)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: "Тестирование не настроено (assessments_unavailable)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
