      description: "Активные участники компании owner, recruiter, viewer с ролью employer. Только активные кандидаты с профилем open или passive и действующими согласиями processing и publication. Неподтверждённые профили доступны по умолчанию; category=null, grade_status=unconfirmed. Условия фильтров объединяются через И. Неизвестные, повторные и пустые параметры возвращают 400. По умолчанию просмотренные или приглашённые этой компанией кандидаты скрыты на 30 дней с последнего взаимодействия. interaction_status=all сохраняет доступ ко всей базе. Сначала подтверждённые категории, затем результат их теста по убыванию; при равенстве сначала новые, затем более давнее взаимодействие, более ранняя дата создания профиля, UUID. Бонус ФСП переставляет кандидатов только внутри одной подтверждённой категории. Без потребности это каталог, а не рейтинг сходства. Профили, контакты и файлы не изменяются."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
        - name: work_format_ids
          in: query
          description: "До 10 уникальных ID из справочника. Подходит любой выбранный формат. Передавать один параметр через запятую, например 1,3."
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items: {type: integer, minimum: 1, maximum: 32767}
        - name: experience_min_months
          in: query
          description: Минимальный стаж в месяцах включительно
          schema: {type: integer, minimum: 0, maximum: 600}
        - name: experience_max_months
          in: query
          description: Максимальный стаж в месяцах включительно; не меньше минимального
          schema: {type: integer, minimum: 0, maximum: 600}
        - name: salary_max_rub
          in: query
          description: "Максимальные зарплатные ожидания в рублях за месяц включительно. При явном фильтре профили без зарплатных ожиданий исключаются."
          schema: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        - name: viewed
          in: query
          description: "История текущей компании: true — профиль уже открывали или отправляли оффер; false — ещё не взаимодействовали. Срок проверяется отдельно через interaction_status."
          schema: {type: boolean}
        - name: interaction_status
          in: query
          description: "available — новые кандидаты и кандидаты, с которыми последнее взаимодействие было не менее 30 дней назад; cooldown — только кандидаты в 30-дневном сроке; all — вся доступная база вместе с историей. Фильтр применяется до подсчёта total и пагинации."
          schema: {type: string, enum: [available, cooldown, all], default: available}
        - name: has_offer
          in: query
          description: "true — этой компанией уже отправлено хотя бы одно приглашение кандидату; false — ещё не отправлялось. Учитываются все потребности и статусы предложений. Без параметра оба варианта."
          schema: {type: boolean}
        - name: has_fsp_achievements
          in: query
          description: "true — есть достижения, false — нет; без параметра оба варианта."
          schema: {type: boolean}
        - name: grade_status
          in: query
          description: "Статус подтверждения грейда. all — все публичные профили; confirmed — категория подтверждена успешным тестом; unconfirmed — подтверждённой категории нет."
          schema: {type: string, enum: [all, confirmed, unconfirmed], default: all}
        - name: specialization_id
          in: query
          description: "Жёсткий фильтр специализации: подтверждённая категория, либо выбор опроса, либо последней попытки при отсутствии опроса при отсутствии категории. Профили без выбранной специализации исключаются."
          schema: {type: integer, minimum: 1, maximum: 32767}
        - name: grade_id
          in: query
          description: "Жёсткий фильтр точного грейда: подтверждённая категория, либо выбор опроса, либо последней попытки при отсутствии опроса. Для поиска только подтверждённых уровней дополнительно задайте grade_status=confirmed."
          schema: {type: integer, minimum: 1, maximum: 32767}
        - name: skill_id
          in: query
          description: UUID активного одобренного навыка. По умолчанию подходят заявленные и подтверждённые навыки.
          schema: {type: string, format: uuid}
        - name: verified_skill_only
          in: query
          description: При true навык должен иметь подтверждение тестом. Требует skill_id.
          schema: {type: boolean, default: false}
