              type: array
              items:
                type: object
                required: [id, code, name, claimed_level, verified_level, source]
                properties:
                  id: {type: string, format: uuid}
                  code: {type: string}
                  name: {type: string}
                  claimed_level: {type: integer, minimum: 1, maximum: 5, nullable: true}
                  verified_level: {type: integer, minimum: 1, maximum: 5, nullable: true}
                  source: {type: string, enum: [claimed, test]}
            assessment:
              type: object
              nullable: true
              description: Результат теста текущей подтверждённой категории. Без подтверждения — null. Вопросы и ответы не раскрываются.
              required: [score_percent, confirmed_at]
              properties:
                score_percent: {type: number, minimum: 0, maximum: 100}
                confirmed_at: {type: string, format: date-time}
            experience:
              type: array
              description: Периоды работы без свободных текстов. Текущее место первым, затем по дате начала.
              items:
                type: object
                required: [started_on, ended_on]
                properties:
                  started_on: {type: string, pattern: '^\d{4}-\d{2}$', example: '2024-05'}
                  ended_on: {type: string, nullable: true, pattern: '^\d{4}-\d{2}$', example: '2025-06'}
            education:
              type: array
              items:
                type: object
                required: [level, graduation_year]
                properties:
                  level: {type: string, enum: [secondary, vocational, incomplete_higher, higher, bachelor, master, phd, doctor]}
                  graduation_year: {type: integer, minimum: 1950, maximum: 2100}
    CandidateBankPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateBankCard'}
        total:
          type: integer
          format: int64
          minimum: 0
          description: Число доступных профилей после фильтрации до пагинации
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 10000}
    CandidateRecommendation:
      allOf:
        - $ref: '#/components/schemas/CandidateBankCard'
        - type: object
          required: [matched_conditions, reasons, unknown_conditions, category, skills, skill_match_score, test_score_percent, match_score, criteria, mismatched_conditions, missing_required_skills]
          properties:
            match_score:
              type: number
              minimum: 0
              maximum: 100
              description: "Общее сходство с потребностью, не вероятность найма. Веса: специализация 30, грейд 20, стек 30, формат 10, бюджет 5, город 3, часовой пояс 2. Неуказанные условия исключаются из знаменателя; неизвестное значение кандидата даёт 0. 100 × сумма(вес × доля совпадения) / сумма активных весов. Округление до двух знаков."
            criteria:
              type: array
              description: Активные критерии потребности, использованные при расчёте match_score
              items:
                type: object
                required: [code, weight, score, status]
                properties:
                  code: {type: string, enum: [specialization, grade, skills, work_format, salary, city, timezone]}
                  weight: {type: number, minimum: 0}
                  score: {type: number, minimum: 0, maximum: 100}
                  status: {type: string, enum: [matched, mismatched, partial, unknown]}
            mismatched_conditions:
              type: array
              items: {type: string}
              description: Известные несовпадения specialization, grade, work_format, salary, city, timezone
            missing_required_skills:
              type: array
              items: {type: string, format: uuid}
              description: Обязательные навыки потребности, о которых нет данных в профиле. Они снижают оценку, но не исключают профиль.
            skills:
              type: array
              description: Требуемые потребностью активные одобренные навыки с указанием источника. Не содержит снимков заданий или ответов.
              items:
                type: object
                required: [id, name, required, weight, effective_weight, source, claimed_level, verified_level]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  required: {type: boolean}
                  weight: {type: number, minimum: 0.01, maximum: 100}
                  effective_weight: {type: number, minimum: 0.01, maximum: 200, description: "Вес требования; для обязательного навыка умножен на 2"}
                  source: {type: string, enum: [test, claimed, missing]}
                  claimed_level: {type: integer, nullable: true, minimum: 1, maximum: 5}
                  verified_level: {type: integer, nullable: true, minimum: 1, maximum: 5}
            skill_match_score:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              description: "Взвешенное покрытие требований стека: test=1, claimed=0.5, missing=0. Формула 100 × сумма(effective_weight × коэффициент) / сумма(effective_weight). Если требований нет — null. Не вероятность найма и не грейд."
            test_score_percent:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
              description: Процент баллов теста подтверждённой категории; без подтверждения null, а не 0
            matched_conditions:
              type: integer
              minimum: 0
              maximum: 4
              description: Количество совпавших условий; не процент пригодности и не оценка квалификации
            reasons:
              type: array
              items: {type: string}
              example: [Совпадает формат работы, Зарплатные ожидания укладываются в бюджет]
            unknown_conditions:
              type: array
              description: "Не хватает значения кандидата или условия потребности. Известное несовпадение не включается в этот список."
              items:
                type: string
                description: "work_format, salary, city, timezone либо skill:<UUID> для отсутствующего необязательного навыка"
