  /api/v1/me:
    get:
      operationId: getMe
      summary: Текущий пользователь приложения
      description: >-
        Требуется JWT access token с audience API и подтверждённым email. Если пользователь ещё не выбрал роль,
        возвращается 404 not_registered. Заблокированный пользователь получает 200 со status=blocked,
        blocked_reason и blocked_at для плашки; любые рабочие методы остаются закрыты (403 user_inactive).
        blocked_companies содержит заблокированные компании активного участника-работодателя.
        Удалённый аккаунт получает 403. Ответ private, no-store.
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Пользователь и его роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Учётная запись удалена (user_inactive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не зарегистрирован (not_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /api/v1/me/register:
    post:
      operationId: registerMe
      summary: Первичная регистрация пользователя с выбором роли
      description: Вызывается один раз после первого входа через Keycloak. Роль выбирает пользователь; роль admin через API выдать нельзя.
      security:
        - bearerAuth: []
