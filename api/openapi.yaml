      description: >-
        Admin и superadmin. verified/rejected принимаются только для pending; unverified отзывает verified. ИНН и готовые
        документы обязательны для подтверждения. expected_version берётся из карточки. После перехода версия
        увеличивается; старый запрос получает 409. Повтор актуального состояния не меняет дату и журнал. Причина нужна для
        rejected/unverified. Изменение названия/ИНН или удаление документа заявки сбрасывают подтверждение.
      security:
        - adminSession: []
      parameters:
