        '403':
          description: Аккаунт заблокирован или пользователь не кандидат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Профиль кандидата ещё не создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
