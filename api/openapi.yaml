openapi: 3.0.3
info:
  title: ФСП API
  version: 0.1.0
  description: Основа API. Продуктовые методы добавляются по мере реализации.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: liveness
      summary: Проверка процесса API
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /readyz:
    get:
      operationId: readiness
      summary: Доступность Postgres, Redis и S3-бакета
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Информация об API
      responses:
        '200':
          description: Версия сервиса
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - version
                properties:
                  name:
                    type: string
                    example: fsp-api
                  version:
                    type: string
                    example: 0.1.0
  /api/v1/me:
    get:
      operationId: getMe
      summary: Текущий пользователь приложения
      description: Требуется JWT access token с audience API и подтверждённым email. Если пользователь ещё не выбрал роль, возвращается 404 not_registered, и нужно вызвать POST /api/v1/me/register.
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Пользователь и его роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Учётная запись заблокирована или удалена (user_inactive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не зарегистрирован (not_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /api/v1/me/register:
    post:
      operationId: registerMe
      summary: Первичная регистрация пользователя с выбором роли
      description: Вызывается один раз после первого входа через Keycloak. Роль выбирает пользователь; роль admin через API выдать нельзя.
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - candidate
                    - employer
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          description: Некорректное тело запроса (validation_error) или недопустимая роль (invalid_role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Пользователь уже зарегистрирован (already_registered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: Публичная конфигурация входа через Keycloak
      responses:
        '200':
          description: Настройки SPA
          content:
            application/json:
              schema:
                type: object
                required:
                  - issuer
                  - client_id
                properties:
                  issuer:
                    type: string
                    format: uri
                  client_id:
                    type: string
                    example: fsp-web
        '503':
          description: Авторизация не настроена
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    keycloakOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __OIDC_ISSUER__/protocol/openid-connect/auth
          tokenUrl: __OIDC_ISSUER__/protocol/openid-connect/token
          scopes:
            openid: OIDC-идентичность
            profile: Профиль
            email: Подтверждённый email
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    CurrentUser:
      type: object
      required:
        - id
        - sub
        - email
        - email_verified
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
          description: Идентификатор пользователя в Keycloak
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum:
            - candidate
            - employer
            - admin
        status:
          type: string
          enum:
            - active
            - blocked
            - deleted
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
              description: Понятное сообщение об ошибке на русском языке
              example: Маршрут не найден
  responses:
    Unauthorized:
      description: Нет валидного токена или email не подтверждён (unauthorized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthUnavailable:
      description: OIDC не настроен (auth_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Healthy:
      description: Сервис доступен
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Идентификатор запроса в логах
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
