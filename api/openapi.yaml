      tags:
        - Задания компаний
      summary: Список решений задания
      description: >-
        Все участники компании. Только решения своего задания от активных кандидатов с действующими глобальными
        processing/publication. Без контактов, user_id и ключа S3; candidate_id — ID профиля. Фильтры только сужают
        область URL.
      security:
        - bearerAuth: []
      parameters:
        - name: company_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: company_id
          in: query
          schema:
            type: string
            format: uuid
        - name: task_id
          in: query
          schema:
            type: string
            format: uuid
        - name: candidate_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - all
              - submitted
              - reviewed
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - newest
              - score
            default: newest
          description: 'newest: дата отправки DESC, ID DESC; score: оценка DESC NULLS LAST, затем дата отправки DESC и ID DESC.'
      responses:
