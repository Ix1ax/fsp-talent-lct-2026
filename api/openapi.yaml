      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCompany
      summary: Обновить профиль компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Только owner. Параллельные запросы не затирают поля, которые не передавались в PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Компания с указанным ИНН уже существует (company_exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCompanyFiles
      summary: Документы и логотипы компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Для активных участников компании. Удалённые файлы не возвращаются. Старые логотипы остаются в списке до явного удаления.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFileList'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: uploadCompanyFile
      summary: Загрузить документ или установить логотип
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только owner. Ровно один file и один purpose. Документы: PDF/JPEG/PNG до 10 МиБ. Логотип: JPEG/PNG до 2 МиБ. Изображения — до 4
        мегапикселей. Тип определяется по содержимому. company_logo автоматически заменяет logo_file_id после успешной загрузки. Бакет
        приватный; скачивание через API с Bearer. Это проверка формата, а не антивирус.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum:
                    - company_document
                    - company_logo
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyFile'
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Превышен допустимый размер файла (file_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Неподдерживаемый тип файла (unsupported_file_type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files/{file_id}/download:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadCompanyFile
      summary: Скачать приватный файл компании
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только активные участники этой компании. В браузере используйте fetch с Authorization и blob; ключ S3 клиенту не нужен. PDF
        возвращается как attachment, логотип — inline. Cache-Control: private, no-store.
      responses:
        '200':
          description: Содержимое файла
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Имя файла и способ отображения
            Cache-Control:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/files/{file_id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCompanyFile
      summary: Удалить документ или логотип
      tags:
        - Компании
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Только owner. Сначала закрывается скачивание и сбрасывается logo_file_id, затем удаляется объект S3. При сбое вернётся 503: повторите
        DELETE. Повторное удаление доступного владельцу файла возвращает 204.
      responses:
        '204':
          description: Файл удалён
        '400':
          description: Некорректный UUID, JSON, параметры или поля (validation_error/invalid_file).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован, роль не employer или участник не владелец.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Компания/файл недоступны этому пользователю, файл ещё не ready либо пользователь не зарегистрирован локально.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис или хранилище временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/companies/{company_id}/needs:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createEmployerNeed
      summary: Создать потребность работодателя
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Owner или recruiter этой компании. По умолчанию draft. Статус active требует навыки и форматы работы. Все связи создаются одной
        транзакцией. created_by берётся из локального пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeedInput'
      responses:
        '201':
          description: Потребность создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerNeed'
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NeedsForbidden'
        '404':
          $ref: '#/components/responses/NeedsNotFound'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
    get:
      operationId: listEmployerNeeds
      summary: Потребности моей компании
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: Активные участники. Без status возвращаются все статусы, включая архив. Новые записи идут первыми.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - active
              - archived
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerNeedList'
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NeedsForbidden'
        '404':
          $ref: '#/components/responses/NeedsNotFound'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
  /api/v1/companies/{company_id}/needs/{need_id}:
    parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: need_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEmployerNeed
      summary: Получить потребность компании
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerNeed'
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NeedsForbidden'
        '404':
          $ref: '#/components/responses/NeedsNotFound'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
    patch:
      operationId: updateEmployerNeed
      summary: Изменить потребность компании
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Owner или recruiter. PATCH сохраняет отсутствующие поля; параллельные изменения сериализуются. Архивную потребность можно вернуть в
        active, если заполнены навыки и форматы.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeedPatch'
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployerNeed'
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NeedsForbidden'
        '404':
          $ref: '#/components/responses/NeedsNotFound'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
    delete:
      operationId: archiveEmployerNeed
      summary: Архивировать потребность
      tags:
        - Потребности работодателя
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Owner или recruiter. Ставит archived, сохраняя запись и связи для подборок и ATS. Повторный DELETE возвращает 204. Скачивание
        документов компании не затрагивается.
      responses:
        '204':
          description: Потребность архивирована
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NeedsForbidden'
        '404':
          $ref: '#/components/responses/NeedsNotFound'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
  /api/v1/catalogs:
    get:
      operationId: getCatalogs
      summary: Справочники специализаций, грейдов и форматов
      tags:
        - Справочники
      security: []
      description: Общие ID для работодателей и соискателей. Возвращаются только активные специализации.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogs'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
  /api/v1/catalogs/skills:
    get:
      operationId: searchSkills
      summary: Найти навык в справочнике
      tags:
        - Справочники
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 10000
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Поиск без учёта регистра по коду, названию и синонимам, например golang. Без q — все активные навыки с пагинацией.
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSkillList'
        '400':
          $ref: '#/components/responses/NeedsBadRequest'
        '500':
          $ref: '#/components/responses/NeedsInternal'
        '503':
          $ref: '#/components/responses/NeedsUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    keycloakOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: __OIDC_ISSUER__/protocol/openid-connect/auth
          tokenUrl: __OIDC_ISSUER__/protocol/openid-connect/token
          scopes:
            openid: OIDC-идентичность
            profile: Профиль
            email: Подтверждённый email
  schemas:
    NeedInput:
      type: object
      additionalProperties: false
      required:
        - specialization_id
        - title
        - description
      properties:
        specialization_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        grade_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Go-разработчик в платформенную команду
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Кого ищем, задачи, условия и описание команды.
        salary_from_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
          description: Рубли в месяц. Не больше salary_to_rub.
        salary_to_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
        city:
          type: string
          nullable: true
          maxLength: 200
        timezone:
          type: string
          nullable: true
          maxLength: 64
          example: Europe/Moscow
          description: Часовой пояс IANA; Local не принимается.
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          default: draft
        skills:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - skill_id
              - weight
            properties:
              skill_id:
                type: string
                format: uuid
              required:
                type: boolean
                default: false
                description: Обязателен ли навык для подбора.
              weight:
                type: number
                minimum: 0.01
                maximum: 100
                multipleOf: 0.01
                example: 1
          description: Не допускаются повторные skill_id. Для active нужен хотя бы один навык.
        work_format_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 32767
          description: ID форматов из GET /api/v1/catalogs. Для active нужен хотя бы один формат.
    NeedPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        specialization_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        grade_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Go-разработчик в платформенную команду
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Кого ищем, задачи, условия и описание команды.
        salary_from_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
          description: Рубли в месяц. Не больше salary_to_rub.
        salary_to_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
        city:
          type: string
          nullable: true
          maxLength: 200
        timezone:
          type: string
          nullable: true
          maxLength: 64
          example: Europe/Moscow
          description: Часовой пояс IANA; Local не принимается.
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          default: draft
        skills:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - skill_id
              - weight
            properties:
              skill_id:
                type: string
                format: uuid
              required:
                type: boolean
                default: false
                description: Обязателен ли навык для подбора.
              weight:
                type: number
                minimum: 0.01
                maximum: 100
                multipleOf: 0.01
                example: 1
          description: Не допускаются повторные skill_id. Для active нужен хотя бы один навык.
        work_format_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 32767
          description: ID форматов из GET /api/v1/catalogs. Для active нужен хотя бы один формат.
      description: >-
        Отсутствующие поля сохраняются. Массивы целиком заменяют прошлый набор. null допустим только для grade_id, salary_from_rub,
        salary_to_rub, city, timezone. Для черновика набор очищается через []. company_id и created_by неизменны.
    EmployerNeed:
      type: object
      required:
        - id
        - company_id
        - created_by
        - specialization_id
        - grade_id
        - title
        - description
        - salary_from_rub
        - salary_to_rub
        - city
        - timezone
        - status
        - skills
        - work_format_ids
        - created_at
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        specialization_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        grade_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Go-разработчик в платформенную команду
        description:
          type: string
          minLength: 1
          maxLength: 10000
          description: Кого ищем, задачи, условия и описание команды.
        salary_from_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
          description: Рубли в месяц. Не больше salary_to_rub.
        salary_to_rub:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000
        city:
          type: string
          nullable: true
          maxLength: 200
        timezone:
          type: string
          nullable: true
          maxLength: 64
          example: Europe/Moscow
          description: Часовой пояс IANA; Local не принимается.
        status:
          type: string
          enum:
            - draft
            - active
            - archived
          default: draft
        skills:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - skill_id
              - weight
            properties:
              skill_id:
                type: string
                format: uuid
              required:
                type: boolean
                default: false
                description: Обязателен ли навык для подбора.
              weight:
                type: number
                minimum: 0.01
                maximum: 100
                multipleOf: 0.01
                example: 1
          description: Не допускаются повторные skill_id. Для active нужен хотя бы один навык.
        work_format_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 32767
          description: ID форматов из GET /api/v1/catalogs. Для active нужен хотя бы один формат.
        created_at:
          type: string
          format: date-time
    EmployerNeedList:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployerNeed'
        limit:
          type: integer
        offset:
          type: integer
    CatalogItem:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        code:
          type: string
        name:
          type: string
    CatalogGrade:
      type: object
      required:
        - id
        - code
        - name
        - rank
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
        code:
          type: string
        name:
          type: string
        rank:
          type: integer
          format: int32
          minimum: 1
          maximum: 32767
    Catalogs:
      type: object
      required:
        - specializations
        - grades
        - work_formats
      properties:
        specializations:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        grades:
          type: array
          items:
            $ref: '#/components/schemas/CatalogGrade'
        work_formats:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    CatalogSkill:
      type: object
      required:
        - id
        - code
        - name
        - aliases
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
    CatalogSkillList:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogSkill'
        limit:
          type: integer
        offset:
          type: integer
    CompanyInput:
      type: object
      additionalProperties: false
      required:
        - name
        - contact_email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: ФСП Технологии
        description:
          type: string
          nullable: true
          maxLength: 10000
        inn:
          type: string
          nullable: true
          pattern: ^([0-9]{10}|[0-9]{12})$
          description: Необязательный уникальный ИНН. Проверяется контрольная сумма; пустая строка очищает поле.
          example: '7707083893'
        contact_email:
          type: string
          format: email
          maxLength: 254
          example: hr@example.org
        contact_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Контактная ссылка http или https, без логина и пароля.
    CompanyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Передавайте только изменяемые поля. null очищает description, inn и contact_url. name и contact_email очистить нельзя. Логотип задаётся
        загрузкой файла с purpose=company_logo.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: ФСП Технологии
        description:
          type: string
          nullable: true
          maxLength: 10000
        inn:
          type: string
          nullable: true
          pattern: ^([0-9]{10}|[0-9]{12})$
          description: Необязательный уникальный ИНН. Проверяется контрольная сумма; пустая строка очищает поле.
          example: '7707083893'
        contact_email:
          type: string
          format: email
          maxLength: 254
          example: hr@example.org
        contact_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Контактная ссылка http или https, без логина и пароля.
    Company:
      type: object
      required:
        - id
        - name
        - description
        - inn
        - contact_email
        - contact_url
        - logo_file_id
        - verification_status
        - created_at
        - member_role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: ФСП Технологии
        description:
          type: string
          nullable: true
          maxLength: 10000
        inn:
          type: string
          nullable: true
          pattern: ^([0-9]{10}|[0-9]{12})$
          description: Необязательный уникальный ИНН. Проверяется контрольная сумма; пустая строка очищает поле.
          example: '7707083893'
        contact_email:
          type: string
          format: email
          maxLength: 254
          example: hr@example.org
        contact_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Контактная ссылка http или https, без логина и пароля.
        logo_file_id:
          type: string
          format: uuid
          nullable: true
        verification_status:
          type: string
          enum:
            - unverified
            - pending
            - verified
            - rejected
          description: При создании unverified. Через профиль менять нельзя.
        created_at:
          type: string
          format: date-time
        member_role:
          type: string
          enum:
            - owner
            - recruiter
            - viewer
    CompanyFile:
      type: object
      required:
        - id
        - purpose
        - original_name
        - media_type
        - size_bytes
        - checksum_sha256
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
            - company_document
            - company_logo
        original_name:
          type: string
        media_type:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        checksum_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
            - pending
            - ready
            - deleting
            - deleted
          description: Скачать можно только ready. pending/deleting после сбоя можно удалить повторным DELETE.
        created_at:
          type: string
          format: date-time
    CompanyList:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Company'
        limit:
          type: integer
        offset:
          type: integer
    CompanyFileList:
      type: object
      required:
        - items
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyFile'
        limit:
          type: integer
        offset:
          type: integer
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    CurrentUser:
      type: object
      required:
        - id
        - sub
        - email
        - email_verified
        - role
        - status
      properties:
        id:
          type: string
          format: uuid
        sub:
          type: string
          description: Идентификатор пользователя в Keycloak
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum:
            - candidate
            - employer
            - admin
        status:
          type: string
          enum:
            - active
            - blocked
            - deleted
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
              description: Понятное сообщение об ошибке на русском языке
              example: Маршрут не найден
  responses:
    NeedsBadRequest:
      description: Неверное поле, UUID, справочник, зарплатная вилка или параметры списка (validation_error).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NeedsForbidden:
      description: Роль не employer, пользователь заблокирован, либо членство не owner/recruiter для записи.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NeedsNotFound:
      description: Компания или потребность недоступны; не зарегистрирован локальный пользователь.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NeedsInternal:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NeedsUnavailable:
      description: Сервис не настроен или временно недоступен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нет валидного токена или email не подтверждён (unauthorized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthUnavailable:
      description: OIDC не настроен (auth_unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Healthy:
      description: Сервис доступен
      headers:
        X-Request-ID:
          schema:
            type: string
          description: Идентификатор запроса в логах
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
