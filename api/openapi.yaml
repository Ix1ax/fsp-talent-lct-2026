          description: "В формате тела POST /me/experience: можно отправлять без преобразования."
          items: {$ref: '#/components/schemas/CandidateExperienceInput'}
        education:
          type: array
          maxItems: 10
          description: "В формате тела POST /me/education: можно отправлять без преобразования."
          items: {$ref: '#/components/schemas/CandidateEducationInput'}
        languages:
          type: array
          items: {$ref: '#/components/schemas/ResumeDraftLanguage'}
    ResumeImportResult:
      type: object
      required: [draft, warnings]
      properties:
        draft: {$ref: '#/components/schemas/ResumeDraft'}
        warnings:
          type: array
          description: "Что не удалось распознать или пришлось пропустить; показывайте кандидату."
          items: {type: string}
    CandidateExperienceInput:
      type: object
      additionalProperties: false
      required: [company, position, started_on]
      properties:
        company: {type: string, minLength: 1, maxLength: 200, example: LazurMedia}
        position: {type: string, minLength: 1, maxLength: 200, example: PHP-программист}
        started_on: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: "2022-11", description: "Месяц начала, формат ГГГГ-ММ, не в будущем (граница учитывает самый восточный часовой пояс, UTC+14)."}
        ended_on: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', nullable: true, example: null, description: "Месяц окончания; null или отсутствие поля значит «по настоящее время» (пустая строка недопустима). Не раньше начала и не в будущем."}
        description: {type: string, maxLength: 2000, default: ""}
    CandidateExperience:
      type: object
      required: [id, company, position, started_on, ended_on, description, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        company: {type: string, minLength: 1, maxLength: 200}
        position: {type: string, minLength: 1, maxLength: 200}
        started_on: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: "2022-11"}
        ended_on: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', nullable: true, description: "null значит «по настоящее время»."}
        description: {type: string, maxLength: 2000}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CandidateExperienceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateExperience'}
    CandidateEducationInput:
      type: object
      additionalProperties: false
      required: [level, institution, graduation_year]
      properties:
        level: {type: string, enum: [secondary, vocational, incomplete_higher, higher, bachelor, master, phd, doctor]}
        institution: {type: string, minLength: 1, maxLength: 200}
        specialty: {type: string, maxLength: 200, default: ""}
        graduation_year: {type: integer, minimum: 1950, maximum: 2100, description: "Год окончания; будущий год допустим (учится сейчас)."}
    CandidateEducation:
      type: object
      required: [id, level, institution, specialty, graduation_year, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        level: {type: string, enum: [secondary, vocational, incomplete_higher, higher, bachelor, master, phd, doctor]}
        institution: {type: string, minLength: 1, maxLength: 200}
        specialty: {type: string, maxLength: 200}
        graduation_year: {type: integer, minimum: 1950, maximum: 2100}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CandidateEducationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandidateEducation'}
    CandidateFullProfile:
      type: object
      required:
        - qualifications
        - onboarding
        - work_format_names
        - profile
        - consents
        - contacts
        - skills
        - category
        - achievements
        - experience
        - education
        - experience_estimated_months
        - readiness
      properties:
        qualifications:
          type: array
          description: Лучший подтверждённый уровень по каждой специализации и стеку. category остаётся последней присвоенной категорией.
          items: {$ref: '#/components/schemas/CandidateCategory'}
        onboarding: {$ref: '#/components/schemas/CandidateOnboarding'}
        work_format_names:
          type: array
          items: {type: string}
        profile:
          nullable: true
          description: Профиль или null, если он ещё не создан.
          allOf:
            - $ref: '#/components/schemas/CandidateProfile'
        consents:
          type: object
          required:
            - current_policy_version
            - items
          properties:
            current_policy_version:
              type: string
            items:
              type: array
              description: Только активные согласия (revoked_at равен null).
              items:
                $ref: '#/components/schemas/Consent'
        contacts:
          nullable: true
          description: Свои контакты или null, если их нет или нет активного согласия processing.
          allOf:
            - $ref: '#/components/schemas/CandidateOwnContacts'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSkill'
        category:
          nullable: true
          description: Категория после последнего пройденного теста или null, если тест не пройден.
          allOf:
            - $ref: '#/components/schemas/CandidateCategory'
        achievements:
          type: array
          description: Импортированные достижения; без истории пустой массив.
          items: {$ref: '#/components/schemas/FSPAchievement'}
        experience:
          type: array
          description: "Места работы: сначала текущее, затем по началу от новых к старым."
          items: {$ref: '#/components/schemas/CandidateExperience'}
        education:
          type: array
          description: "Образование по году окончания от новых к старым."
          items: {$ref: '#/components/schemas/CandidateEducation'}
        experience_estimated_months:
          type: integer
          nullable: true
          minimum: 0
          maximum: 600
          description: "Подсказка: стаж по местам работы в месяцах (пересечения не считаются дважды); null, если мест работы нет. Поле experience_months профиля не меняется."
        readiness:
          $ref: '#/components/schemas/CandidateReadiness'
    CandidateReadiness:
      type: object
      required:
        - percent
        - ready_to_publish
        - items
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Доля выполненных пунктов от всех, округлённая.
        ready_to_publish:
          type: boolean
          description: Истинно, когда выполнены все обязательные пункты.
        items:
          type: array
          description: Пункты в фиксированном порядке, сначала шесть обязательных.
          items:
            $ref: '#/components/schemas/CandidateReadinessItem'
    CandidateReadinessItem:
      type: object
      required:
        - code
        - title
        - done
        - required
      properties:
        code:
          type: string
          enum:
            - consent_processing
            - profile
            - contacts
            - skills
            - work_formats
            - consent_publication
            - headline
            - summary
            - city
            - salary
            - avatar
        title:
          type: string
          description: Название пункта для пользователя на русском языке.
        done:
          type: boolean
        required:
          type: boolean
    AssessmentOption:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,16}$'
        text:
          type: string
          minLength: 1
          maxLength: 500
    AssessmentPrompt:
      type: object
      additionalProperties: false
      required: [text]
      description: "Для code_reading обязателен code. Варианты options (от 2 до 10) нужны для choice и для code_reading с проверкой выбором, для short_answer их быть не должно."
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        code:
          type: string
          maxLength: 10000
        language:
          type: string
          maxLength: 32
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/AssessmentOption'
    AssessmentGradingSpec:
      type: object
      additionalProperties: false
      required: [type]
      description: "type choice: correct (id правильных вариантов), multiple. type text: accepted (от 1 до 20 допустимых ответов), case_sensitive. Кандидату правила не показываются."
      properties:
        type:
          type: string
          enum: [choice, text]
        correct:
          type: array
          items: {type: string}
        multiple:
          type: boolean
        accepted:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, minLength: 1, maxLength: 200}
        case_sensitive:
          type: boolean
    AssessmentQuestionInput:
      type: object
      additionalProperties: false
      required: [skill_id, difficulty, kind, prompt, grading_spec]
      properties:
        skill_id: {type: string, format: uuid}
        difficulty: {type: integer, minimum: 1, maximum: 5}
        kind: {type: string, enum: [choice, code_reading, short_answer]}
        prompt: {$ref: '#/components/schemas/AssessmentPrompt'}
        grading_spec: {$ref: '#/components/schemas/AssessmentGradingSpec'}
    AssessmentVersionInput:
      type: object
      additionalProperties: false
      required: [prompt, grading_spec]
      properties:
        prompt: {$ref: '#/components/schemas/AssessmentPrompt'}
        grading_spec: {$ref: '#/components/schemas/AssessmentGradingSpec'}
    AssessmentQuestionVersion:
      type: object
      required: [version, status, prompt, grading_spec, created_at, published_at]
      properties:
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, published, archived]}
        prompt: {$ref: '#/components/schemas/AssessmentPrompt'}
        grading_spec: {$ref: '#/components/schemas/AssessmentGradingSpec'}
        created_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time, nullable: true}
    AssessmentQuestion:
      type: object
      required: [id, skill_id, skill_name, difficulty, kind, active, created_at, latest_version, published_version]
      properties:
        id: {type: string, format: uuid}
        skill_id: {type: string, format: uuid}
        skill_name: {type: string}
        difficulty: {type: integer, minimum: 1, maximum: 5}
        kind: {type: string, enum: [choice, code_reading, short_answer]}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
        latest_version: {type: integer}
        published_version: {type: integer, nullable: true}
        versions:
          type: array
          description: "Только в ответах про одно задание, от новой версии к старой."
          items: {$ref: '#/components/schemas/AssessmentQuestionVersion'}
    AssessmentQuestionPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AssessmentQuestion'}
        total: {type: integer, format: int64}
        limit: {type: integer}
        offset: {type: integer}
    AssessmentBlueprintRow:
      type: object
      additionalProperties: false
      required: [skill_id, difficulty, question_count, weight]
      properties:
        skill_id: {type: string, format: uuid}
        difficulty: {type: integer, minimum: 1, maximum: 5}
        question_count: {type: integer, minimum: 1, maximum: 50}
        weight: {type: number, minimum: 0.01, maximum: 100, description: "Не более двух знаков после запятой."}
    AssessmentTemplateInput:
      type: object
      additionalProperties: false
      required: [stack_skill_id, specialization_id, grade_id, time_limit_sec, pass_score, blueprint]
      properties:
        stack_skill_id: {type: string, format: uuid}
        specialization_id: {type: integer, minimum: 1}
        grade_id: {type: integer, minimum: 1}
        time_limit_sec: {type: integer, minimum: 300, maximum: 14400}
        pass_score: {type: number, minimum: 1, maximum: 100, description: "Проходной балл в процентах от взвешенной суммы."}
        blueprint:
          type: array
          minItems: 1
          maxItems: 30
          description: "Пары навык и сложность не повторяются."
          items: {$ref: '#/components/schemas/AssessmentBlueprintRow'}
    AssessmentTemplate:
      type: object
      required: [stack_skill_id, stack_name, id, specialization_id, grade_id, version, time_limit_sec, pass_score, status, created_at, published_at]
      properties:
        stack_skill_id: {type: string, description: UUID основного навыка; пустая строка у старого шаблона без стека}
        stack_name: {type: string, nullable: true}
        id: {type: string, format: uuid}
        specialization_id: {type: integer}
        grade_id: {type: integer}
        version: {type: integer, minimum: 1}
        time_limit_sec: {type: integer}
        pass_score: {type: number}
        status: {type: string, enum: [draft, published, archived]}
        created_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time, nullable: true}
        blueprint:
          type: array
          description: "Только в ответах про один шаблон."
          items:
            allOf:
              - $ref: '#/components/schemas/AssessmentBlueprintRow'
              - type: object
                required: [skill_name, available]
                properties:
                  skill_name: {type: string}
                  available: {type: integer, description: "Активных заданий с опубликованной версией для пары навык и сложность."}
    AssessmentTemplatePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AssessmentTemplate'}
        total: {type: integer, format: int64}
        limit: {type: integer}
        offset: {type: integer}
    AssessmentShortage:
      type: object
      required: [skill_id, difficulty, required, available]
      properties:
        skill_id: {type: string, format: uuid}
        difficulty: {type: integer}
        required: {type: integer}
        available: {type: integer}
    AssessmentInsufficientQuestions:
      type: object
      required: [error, shortages]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [insufficient_questions]}
            message: {type: string}
        shortages:
          type: array
          items: {$ref: '#/components/schemas/AssessmentShortage'}
    AssessmentConflictError:
      description: "Ошибка 409 со справочными полями: attempt_id при attempt_active, retry_at при retake_cooldown."
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: retake_cooldown}
            message: {type: string}
            attempt_id: {type: string, format: uuid, description: "Только при attempt_active."}
            retry_at: {type: string, format: date-time, description: "Только при retake_cooldown: когда можно пересдать."}
    AssessmentStartRequest:
      type: object
      additionalProperties: false
      required: [stack_skill_id, specialization_id, grade_id]
      properties:
        stack_skill_id: {type: string, format: uuid}
        specialization_id: {type: integer, minimum: 1, example: 1}
        grade_id: {type: integer, minimum: 1, example: 2}
    AssessmentAnswerRequest:
      type: object
      additionalProperties: false
      description: "Ровно одно из полей: selected для заданий с вариантами, text для текстовых."
      properties:
        selected:
          type: array
          items: {type: string}
          example: [a]
        text:
          type: string
          maxLength: 500
    AssessmentAvailable:
      type: object
      required: [stack_skill_id, stack_name, specialization_id, grade_id, time_limit_sec, pass_score, question_count, can_start, reason, retry_at, confirmed]
      properties:
        stack_skill_id: {type: string, format: uuid}
        stack_name: {type: string}
        specialization_id: {type: integer}
        grade_id: {type: integer}
        time_limit_sec: {type: integer}
        pass_score: {type: number, description: "Проходной балл в процентах."}
        question_count: {type: integer}
        can_start: {type: boolean}
        reason: {type: string, enum: [ok, attempt_active, retake_cooldown, grade_change_cooldown, already_confirmed, consent_required, assessment_unavailable]}
        retry_at: {type: string, format: date-time, nullable: true, description: "Дата следующего старта при retake_cooldown или grade_change_cooldown."}
        confirmed: {type: boolean, description: "Этот грейд уже подтверждён."}
    AssessmentAvailableList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AssessmentAvailable'}
    AssessmentAnswer:
      type: object
      properties:
        selected:
          type: array
          items: {type: string}
        text: {type: string}
    AssessmentAttemptQuestion:
      type: object
      required: [id, position, skill_id, difficulty, multiple, prompt, answer]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 1}
        multiple: {type: boolean, description: "Можно выбрать несколько вариантов (передайте несколько id в selected); для заданий с одним вариантом и текстовых false."}
        skill_id: {type: string, format: uuid}
        difficulty: {type: integer, minimum: 1, maximum: 5}
        prompt: {$ref: '#/components/schemas/AssessmentPrompt'}
        answer:
          nullable: true
          description: "Сохранённый ответ или null."
          allOf:
            - $ref: '#/components/schemas/AssessmentAnswer'
    AssessmentSkillResult:
      type: object
      required: [skill_id, name, percent, confirmed, level]
      properties:
        skill_id: {type: string, format: uuid}
        name: {type: string}
        percent: {type: number, description: "Доля набранных баллов по навыку."}
        confirmed: {type: boolean, description: "Навык подтверждён: тест пройден и процент по навыку не ниже проходного."}
        level: {type: integer, nullable: true, minimum: 1, maximum: 5}
    CandidateCategory:
      type: object
      required: [stack_skill_id, stack_name, specialization_id, specialization, grade_id, grade, confirmed_at]
      properties:
        stack_skill_id: {type: string, format: uuid, nullable: true}
        stack_name: {type: string, nullable: true}
        specialization_id: {type: integer}
        specialization: {type: string, example: Бэкенд}
        grade_id: {type: integer}
        grade: {type: string, example: Junior}
        confirmed_at: {type: string, format: date-time}
    AssessmentAttemptResult:
      type: object
      required: [passed, score_percent, pass_score, skills, category, retry_at, next_grade_change_at]
      properties:
        next_grade_change_at: {type: string, format: date-time, nullable: true, description: Семь дней после последнего успешного присвоения категории; null до первого успеха}
        passed: {type: boolean}
        score_percent: {type: number}
        pass_score: {type: number}
        skills:
          type: array
          items: {$ref: '#/components/schemas/AssessmentSkillResult'}
        category:
          nullable: true
          description: "Категория и стек успешной попытки. Для успеха нужен проходной общий балл и проходной результат по основному навыку. Старые попытки имеют stack_skill_id и stack_name = null."
          allOf:
            - $ref: '#/components/schemas/CandidateCategory'
        retry_at: {type: string, format: date-time, nullable: true, description: "Когда можно пересдать (если не пройден)."}
    AssessmentAttempt:
      type: object
      required: [stack_skill_id, stack_name, id, status, specialization_id, grade_id, started_at, deadline_at, finished_at, time_limit_sec, questions, result]
      properties:
        stack_skill_id: {type: string, format: uuid, nullable: true}
        stack_name: {type: string, nullable: true}
        id: {type: string, format: uuid}
        status: {type: string, enum: [active, passed, failed, expired]}
        specialization_id: {type: integer}
        grade_id: {type: integer}
        started_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        time_limit_sec: {type: integer}
        questions:
          type: array
          description: "Задания (только у активной попытки; без правил проверки)."
          items: {$ref: '#/components/schemas/AssessmentAttemptQuestion'}
        result:
          nullable: true
          description: "Итог (только у завершённой попытки)."
          allOf:
            - $ref: '#/components/schemas/AssessmentAttemptResult'

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
    CurrentUser:
      type: object
      required:
        - id
        - sub
        - email
        - email_verified
        - role
        - status
        - blocked_reason
        - blocked_at
        - blocked_companies
      properties:
        blocked_reason:
          $ref: '#/components/schemas/BlockReason'
        blocked_at:
          $ref: '#/components/schemas/BlockTime'
        blocked_companies:
          type: array
          items:
            $ref: '#/components/schemas/BlockedCompany'
        id:
          type: string
          format: uuid
        sub:
          type: string
          description: Идентификатор пользователя в Keycloak
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum:
            - candidate
            - employer
            - admin
        status:
          type: string
          enum:
            - active
            - blocked
            - deleted
    BlockReason:
      type: string
      nullable: true
      minLength: 1
      maxLength: 2000
      description: Причина действующей блокировки; null после разблокировки.
    BlockTime:
      type: string
      nullable: true
      format: date-time
      description: Дата действующей блокировки; null после разблокировки.
    BlockedCompany:
      type: object
      required: [id, name, blocked_reason, blocked_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        blocked_reason: {type: string, minLength: 1, maxLength: 2000}
        blocked_at: {type: string, format: date-time}
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
              description: Понятное сообщение об ошибке на русском языке
            status:
              type: string
              enum: [blocked]
              description: Дополнительное поле user_inactive при блокировке аккаунта.
            entity_type:
              type: string
              enum: [user, company]
            entity_id:
              type: string
              format: uuid
            reason:
              $ref: '#/components/schemas/BlockReason'
            blocked_at:
              $ref: '#/components/schemas/BlockTime'
  responses:
    AdminOperations400:
      description: 'validation_error: неизвестный, повторный или некорректный параметр, UUID или тело.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminOperations401:
      description: 'unauthorized: требуется действующая отдельная сессия админки; для employer-маршрутов нужен Keycloak JWT.'
      content:
