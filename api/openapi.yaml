      required: [id, city, timezone, experience_months, salary_min_rub, search_status, work_format_ids, category, declared_category, grade_status, achievements_count, fsp_bonus, has_offer, viewed, last_viewed_at, last_offered_at, next_available_at]
      properties:
        viewed: {type: boolean, description: Эта компания открывала профиль или отправляла оффер; сохраняется после истечения срока}
        last_viewed_at: {type: string, format: date-time, nullable: true, description: Последнее открытие профиля или отправка оффера этой компанией}
        last_offered_at: {type: string, format: date-time, nullable: true, description: Последняя отправка оффера этой компанией независимо от его статуса}
        next_available_at: {type: string, format: date-time, nullable: true, description: Последнее взаимодействие плюс ровно 720 часов; null при отсутствии истории. После этой даты кандидат снова участвует в обычной выдаче}
        has_offer:
          type: boolean
          description: Эта компания уже отправляла кандидату предложение. Учитываются все потребности и статусы, включая accepted и rejected; предложения других компаний не влияют. Старые предложения также учитываются.
        achievements_count: {type: integer, minimum: 0, description: Число импортированных достижений}
        fsp_bonus: {type: number, minimum: 0, maximum: 5, description: Бонус только внутри одной подтверждённой категории; грейд и match_score не меняет}
        grade_status: {type: string, enum: [confirmed, unconfirmed]}
        declared_category:
          type: object
          nullable: true
          description: Самооценка из опроса, либо выбор последней попытки при отсутствии опроса. Это не подтверждённая категория; без опроса и попыток null.
          required: [specialization_id, grade_id, stack_skill_id, stack_name]
          properties:
            stack_skill_id: {type: string, format: uuid, nullable: true}
            stack_name: {type: string, nullable: true}
            specialization_id: {type: integer, minimum: 1}
            grade_id: {type: integer, minimum: 1}
        category:
          type: object
          nullable: true
          required: [specialization_id, grade_id, stack_skill_id, stack_name]
          description: Категория успешного теста. null означает отсутствие подтверждения.
          properties:
            stack_skill_id: {type: string, format: uuid, nullable: true}
            stack_name: {type: string, nullable: true}
            specialization_id: {type: integer, minimum: 1}
            grade_id: {type: integer, minimum: 1}
        id: {type: string, format: uuid}
        city: {type: string, nullable: true, maxLength: 200}
        timezone: {type: string, nullable: true, maxLength: 64}
        experience_months: {type: integer, minimum: 0, maximum: 600}
        salary_min_rub: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 1000000000}
        search_status: {type: string, enum: [open, passive]}
        work_format_ids:
          type: array
          items: {type: integer, minimum: 1}
      example:
        has_offer: false
        viewed: false
        last_viewed_at: null
        last_offered_at: null
        next_available_at: null
        grade_status: confirmed
