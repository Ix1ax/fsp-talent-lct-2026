        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSkillMergeInput'
      responses:
        '200':
          description: Карточка после модерации и число затронутых связей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSkillModerationResult'
        '400':
          description: Некорректный ID, причина или целевой навык.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Некорректные параметры запроса
        '401':
          description: Нужна действующая сессия админки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
