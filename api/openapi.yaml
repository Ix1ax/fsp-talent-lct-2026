  /api/v1/me/profile:
    post:
      operationId: createCandidateProfile
      summary: Создать свой профиль кандидата
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Требуется локальная роль candidate. Один пользователь может создать только один профиль. Статус поиска по умолчанию hidden: профиль
        никому не виден, пока кандидат сам не выберет open или passive. Грейд и категория не задаются, они появляются после тестирования.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileInput'
      responses:
        '201':
          description: Профиль создан.
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/me/profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400':
          description: Некорректный JSON, неизвестное поле или значение вне допустимых границ (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Профиль уже создан (profile_exists) или нет согласия на обработку (consent_required); для open и passive нужны ещё и publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Тело запроса больше 2 МиБ (request_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис не настроен (candidate_unavailable, avatar_unavailable) или хранилище файлов недоступно (storage_unavailable, upload_busy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getCandidateProfile
      summary: Получить свой профиль кандидата
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      responses:
        '200':
          description: Профиль текущего кандидата.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Профиль ещё не создан (profile_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис не настроен (candidate_unavailable, avatar_unavailable) или хранилище файлов недоступно (storage_unavailable, upload_busy).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCandidateProfile
      summary: Изменить свой профиль кандидата
      tags:
        - Кандидаты
      security:
        - bearerAuth: []
        - keycloakOAuth:
            - openid
            - email
      description: >-
        Отсутствующее поле сохраняет значение, null очищает необязательное поле. experience_months и search_status очистить нельзя.
        Непустой work_format_ids заменяет набор целиком, пустой список очищает его. Поля id, user_id, avatar_file_id и updated_at изменить нельзя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfilePatch'
      responses:
        '200':
          description: Профиль после изменения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfile'
        '400':
          description: Пустой PATCH, неизвестное поле или значение вне допустимых границ (validation_error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен действительный access token и подтверждённый email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь заблокирован (user_inactive) или его роль не candidate (forbidden).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Профиль ещё не создан (profile_not_found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Для open и passive нужны активные согласия processing и publication (consent_required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Тело запроса больше 2 МиБ (request_too_large).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Сервис не настроен (candidate_unavailable, avatar_unavailable) или хранилище файлов недоступно (storage_unavailable, upload_busy).
