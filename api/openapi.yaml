openapi: 3.0.3
info:
  title: ФСП API
  version: 0.1.0
  description: Основа API. Продуктовые методы добавляются по мере реализации.
servers:
  - url: /
paths:
  /api/v1/admin/admins/{admin_id}:
    patch:
      operationId: updateAdminStatus
      tags: [Админка]
      summary: Блокировать или включить обычного администратора
      description: "Только superadmin. Изменение собственного аккаунта или superadmin запрещено: 409 admin_status_change_forbidden. Блокировка атомарно отзывает все сессии; включение старые токены не восстанавливает. Повтор того же статуса возвращает 200. Неизвестный UUID — 404 admin_not_found."
      security:
        - adminSession: []
      parameters:
        - name: admin_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminStatusInput'}
      responses:
        '200':
          description: Успешно
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
            X-Request-ID:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAccount'}
        '400':
          description: Некорректный UUID, JSON или параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Недействующая админская сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Запись не найдена или недоступна
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Превышен размер запроса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/assessments/templates/{template_id}/previews:
    post:
      operationId: startAdminAssessmentPreview
      tags: [Админка]
      summary: Начать серверное пробное прохождение
      description: "Конкретный draft или published шаблон; archived — 409 assessment_conflict. Не более 3 активных preview на администратора (409 preview_limit). Снимки банка и веса фиксируются. Отдельные таблицы без влияния на кандидатов. Хранение 7 дней от старта, ленивая очистка. Правильные ответы доступны только после submit или истечения. Идемпотентный повтор также возвращает 201."
      security:
        - adminSession: []
      parameters:
        - name: template_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: false
          description: 'Печатный ASCII без пробелов, 1–128 символов. Повтор возвращает тот же preview в пределах retain_until; другой шаблон — 409 idempotency_conflict.'
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
      responses:
        '201':
          description: Успешно
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
            X-Request-ID:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAssessmentPreview'}
        '400':
          description: Некорректный UUID, JSON или параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Недействующая админская сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Недостаточно прав при проверке аккаунта в БД
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Запись не найдена или недоступна
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'assessment_conflict, preview_limit, idempotency_conflict или insufficient_questions с shortages'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/AssessmentInsufficientQuestions'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/assessments/previews/{preview_id}:
    get:
      operationId: getAdminAssessmentPreview
      tags: [Админка]
      summary: Восстановить своё пробное прохождение
      description: "Чужой, удалённый или старше retain_until — 404 preview_not_found. При дедлайне автоматически финализирует сохранённые ответы: 200 expired с результатом. Время сервера в server_time."
      security:
        - adminSession: []
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Успешно
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
            X-Request-ID:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAssessmentPreview'}
        '400':
          description: Некорректный UUID, JSON или параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Недействующая админская сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Недостаточно прав при проверке аккаунта в БД
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Запись не найдена или недоступна
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: deleteAdminAssessmentPreview
      tags: [Админка]
      summary: Удалить своё пробное прохождение
      description: "Физически удаляет preview и ответы. Повтор и чужой UUID возвращают 204 без раскрытия существования. После удаления GET возвращает 404; отменённый объект не хранится, cancelled не возвращается."
      security:
        - adminSession: []
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Успешно
        '400':
          description: Некорректный UUID, JSON или параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Недействующая админская сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Недостаточно прав при проверке аккаунта в БД
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/assessments/previews/{preview_id}/answers/{question_id}:
    put:
      operationId: saveAdminPreviewAnswer
      tags: [Админка]
      summary: Сохранить или заменить ответ предпросмотра
      description: "question_id — id вопроса внутри preview, не question_id банка. 204 при успехе. Те же ValidateAnswer правила, что кандидату. После дедлайна сохраняемые ранее ответы финализируются, новый ответ отклоняется: 409 preview_expired. После submit — 409 preview_closed. Чужой вопрос — 404 preview_not_found."
      security:
        - adminSession: []
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: question_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssessmentAnswerRequest'}
      responses:
        '204':
          description: Успешно
        '400':
          description: Некорректный UUID, JSON или параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Недействующая админская сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Недостаточно прав при проверке аккаунта в БД
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Запись не найдена или недоступна
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Превышен размер запроса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/admin/assessments/previews/{preview_id}/submit:
    post:
      operationId: submitAdminAssessmentPreview
      tags: [Админка]
      summary: Завершить своё пробное прохождение
      description: "Повтор возвращает сохранённый результат. После дедлайна статус expired независимо от passed. Вес вопроса равен весу строки blueprint / question_count, фиксируется numeric(10,4), как у кандидата. Нет частичных баллов; пропуск — 0. Процент округляется до сотых, для passed общий и основной навык должны достигнуть pass_score. Текст нормализует пробелы и при case_sensitive=false регистр."
      security:
        - adminSession: []
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Успешно
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
            X-Request-ID:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminAssessmentPreview'}
        '400':
          description: Некорректный UUID, JSON или параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: Недействующая админская сессия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Недостаточно прав при проверке аккаунта в БД
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Запись не найдена или недоступна
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/assessments/history:
    get:
      operationId: getCandidateAssessmentHistory
      tags: [Тестирование кандидата]
      summary: История собственных попыток и присвоенных категорий
      description: "Только текущий кандидат. Новые попытки первыми. Возвращает результаты и категорию, присвоенную каждой успешной попыткой, без вопросов и правильных ответов. Чтение истории доступно после отзыва processing; новые ответы и старт запрещены. Просроченная попытка закрывается без присвоения категории при отозванном согласии."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssessmentHistoryPage'}
        '400':
          description: Некорректные параметры
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет активной роли кандидата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Профиль не создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Тестирование не настроено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/profile/onboarding:
    get:
      operationId: getCandidateOnboarding
      tags: [Кандидат]
      summary: Состояние первичного пути кандидата
      description: "Следующий шаг, сохранённый опрос и последняя попытка. Без processing опрос и попытка скрыты; возвращается шаг consent. Истёкшая active-попытка не даёт шаг in_progress; для актуализации результата вызовите GET /me/assessments/attempts/{id} с ID последней попытки. Ответ не кешируется."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      responses:
        '200':
          description: Следующий шаг и собственные данные
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateOnboarding'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет активной роли кандидата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    put:
      operationId: putCandidateSurvey
      tags: [Кандидат]
      summary: Сохранить опрос, предполагаемый грейд и софт-скиллы
      description: "Нужны собственный профиль и processing. Запрос полностью заменяет опрос. Специализация и грейд должны быть активны в справочнике; это самооценка, подтверждённая категория не меняется."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CandidateSurveyInput'}
      responses:
        '200':
          description: Сохранённый опрос
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateSurvey'}
        '400':
          description: Некорректный опрос или неизвестный/архивированный справочник
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет активной роли кандидата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Сначала создайте профиль
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Нужно согласие processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: Превышен допустимый размер запроса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/profile/export.pdf:
    get:
      operationId: exportCandidatePDF
      tags: [Кандидат]
      summary: Скачать собственное стандартное резюме PDF
      description: "Нужны профиль и processing. Только текущий кандидат; чужой ID не принимается. PDF включает контакты, резюме, навыки, опыт, образование, софт-скиллы, подтверждённую категорию и достижения. Без подтверждения грейд явно отмечен. Ответ private, no-store; скачивание resume.pdf."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      responses:
        '200':
          description: Готовое резюме
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет активной роли кандидата
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: Профиль не создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Нужно согласие processing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Экспорт занят или сервис не настроен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/v1/me/fsp:
    get:
      operationId: getFSP
      tags: [ФСП]
      summary: Привязка и достижения ФСП
      description: "Только собственный профиль кандидата с согласием processing. Используется синтетический реестр fsp_mock; это не подтверждение реального ФСП ID. Идентичность берётся из проверенного входа, тело запроса не требуется. Ошибка источника сохраняет прежние достижения. Повторная привязка не создаёт дубли."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      responses:
        '200':
          description: "Состояние привязки; без истории items пустой."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FSPProfile'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет роли кандидата, профиля или согласия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Нет привязки для sync или конфликт идентичности
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Источник недоступен или вернул некорректные данные
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      operationId: unlinkFSP
      tags: [ФСП]
      summary: Удалить собственную привязку ФСП и импортированные достижения
      description: "Повторный вызов безопасен. Доступен после отзыва processing. Подтверждённый тестом грейд сохраняется."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      responses:
        '204':
          description: Привязка отсутствует
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет активного профиля кандидата
        '503':
          description: Сервис недоступен
        '500':
          description: Внутренняя ошибка
  /api/v1/me/fsp/link:
    post:
      operationId: linkFSP
      tags: [ФСП]
      summary: Привязать тестовый ФСП ID
      description: "Только собственный профиль кандидата с согласием processing. Используется синтетический реестр fsp_mock; это не подтверждение реального ФСП ID. Идентичность берётся из проверенного входа, тело запроса не требуется. Ошибка источника сохраняет прежние достижения. Повторная привязка не создаёт дубли."
      security:
        - bearerAuth: []
        - keycloakOAuth: [openid, email]
      responses:
        '200':
          description: "Состояние привязки; без истории items пустой."
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FSPProfile'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет роли кандидата, профиля или согласия
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Нет привязки для sync или конфликт идентичности
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
