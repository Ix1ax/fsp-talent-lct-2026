name: fsp-production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsp
      POSTGRES_DB: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fsp -d fsp
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    command:
      - postgres
      - "-c"
      - shared_buffers=64MB
      - "-c"
      - max_connections=50
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
      - sh
      - "-c"
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
        --appendonly no
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 192m
  s3:
    image: chrislusf/seaweedfs:4.37
    restart: unless-stopped
    command:
      - mini
      - "-dir=/data"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
    volumes:
      - s3-data:/data
    mem_limit: 320m
  migrate:
    image: ${API_IMAGE:?required}
    entrypoint:
      - migrate
    environment:
      DATABASE_URL: postgres://fsp:${POSTGRES_PASSWORD}@postgres:5432/fsp?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: ${API_IMAGE:?required}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://fsp:${POSTGRES_PASSWORD}@postgres:5432/fsp?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      OIDC_ISSUER: http://${PUBLIC_HOST:?required}:8081/realms/fsp
      OIDC_CLIENT_ID: fsp-api
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/fsp
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      OIDC_ALLOW_HTTP: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "-O"
        - /dev/null
        - http://127.0.0.1:8080/readyz
      interval: 5s
      timeout: 4s
      retries: 30
    mem_limit: 160m
    ports:
      - "8080:8080"
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 192m
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    ports:
      # Тестовая почта доступна команде без SSH-туннеля.
      - "8025:8025"
    volumes:
      - mailpit-data:/data
    mem_limit: 64m
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start
      - "--import-realm"
      - "--cache=local"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://${PUBLIC_HOST:?required}:8081
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
      API_PUBLIC_URL: http://${PUBLIC_HOST:?required}:8080
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection:
          close\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
volumes:
  mailpit-data:
  postgres-data:
  s3-data:
  keycloak-data:
