name: CI
'on':
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: sh scripts/check-openapi.sh
        working-directory: .
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./cmd/...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Настройка кеша Docker
        uses: docker/setup-buildx-action@v3
      - name: Сборка API с кешем
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          load: true
          tags: fsp-api:ci
          cache-from: type=gha,scope=fsp-api
          cache-to: type=gha,scope=fsp-api,mode=max
      - name: Сборка фронта с кешем
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: fsp-web:ci
          cache-from: type=gha,scope=fsp-web
          cache-to: type=gha,scope=fsp-web,mode=max
      - name: Запуск тестового окружения
        run: docker compose --profile app up -d --no-build --wait --wait-timeout 360
      - run: sh scripts/smoke.sh
      - run: sh scripts/keycloak-smoke.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Проверка записи и чтения хранилищ
        run: |
          cp apps/api/.env.example apps/api/.env
          make integration
      - name: Логи при ошибке
        if: failure()
        run: docker compose --profile app logs --tail=100
      - name: Удаление тестового окружения
        if: always()
        run: docker compose --profile app down -v
    env:
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
