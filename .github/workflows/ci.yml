name: CI
"on":
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Деплой API и фронта
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Проверка секретов деплоя
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |-
          python3 - <<'PY'
          import os, sys
          names = ["DEPLOY_HOST", "DEPLOY_USER", "DEPLOY_SSH_KEY", "DEPLOY_KNOWN_HOSTS", "PRODUCTION_ENV"]
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          if missing:
              sys.exit("Не заполнены GitHub Secrets environment production: " + ", ".join(missing))
          PY
      - id: images
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.images.outputs.prefix }}/api:${{ steps.images.outputs.sha }}
          cache-from: type=gha,scope=fsp-api
          cache-to: type=gha,scope=fsp-api,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        name: Публикация образа API с кешем
      - name: Публикация образа фронта с кешем
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.prefix }}/web:${{ steps.images.outputs.sha }}
          cache-from: type=gha,scope=fsp-web
          cache-to: type=gha,scope=fsp-web,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Настройка SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*
      - name: Подготовка релиза
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          SHA: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |-
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > deploy/.env
          printf 'API_IMAGE=%s/api:%s\n' "$IMAGE_PREFIX" "$SHA" >> deploy/.env
          printf 'WEB_IMAGE=%s/web:%s\n' "$IMAGE_PREFIX" "$SHA" >> deploy/.env
          if ! grep -q '^PUBLIC_HOST=' deploy/.env; then
            printf 'PUBLIC_HOST=%s\n' "$DEPLOY_HOST" >> deploy/.env
          fi
          mkdir -p deploy/keycloak
          cp infra/keycloak/fsp-realm.json deploy/keycloak/fsp-realm.json
          mkdir -p deploy/keycloak-themes
          cp -R infra/keycloak/themes/fsp-scout deploy/keycloak-themes/fsp-scout
          # Theme resources are public. The container's keycloak user must read them;
          # keep .env and SSH keys private under the existing umask.
          find deploy/keycloak-themes -type d -exec chmod 755 {} +
          find deploy/keycloak-themes -type f -exec chmod 644 {} +
          cp scripts/keycloak-theme.sh deploy/keycloak-theme.sh
          cp scripts/keycloak-web.py deploy/keycloak-web.py
          cp scripts/deploy-server.sh deploy/deploy-server.sh
      - name: Деплой API и фронта
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: >-
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/fsp/keycloak && chmod 700 ~/fsp'

          scp deploy/compose.yaml deploy/.env deploy/deploy-server.sh deploy/keycloak-theme.sh deploy/keycloak-web.py "$DEPLOY_USER@$DEPLOY_HOST:fsp/"

          scp deploy/keycloak/fsp-realm.json "$DEPLOY_USER@$DEPLOY_HOST:fsp/keycloak/"

          scp -r deploy/keycloak-themes "$DEPLOY_USER@$DEPLOY_HOST:fsp/"

          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u
          '$GHCR_USER' --password-stdin"

          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/fsp && sh deploy-server.sh'
      - name: Удаление временных секретов
        if: always()
        run: rm -f deploy/.env ~/.ssh/id_ed25519 ~/.ssh/known_hosts
