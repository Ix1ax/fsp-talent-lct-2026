name: Release and deploy
'on':
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.images.outputs.prefix }}
      sha: ${{ steps.images.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: images
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ steps.images.outputs.prefix }}/api:${{ steps.images.outputs.sha }}
          cache-from: type=gha,scope=fsp-api
          cache-to: type=gha,scope=fsp-api,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        name: Публикация образа API с кешем
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*
      - name: Prepare release
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |-
          umask 077
          printf '%s\n' "$PRODUCTION_ENV" > deploy/.env
          printf 'API_IMAGE=%s/api:%s\n' "$IMAGE_PREFIX" "$SHA" >> deploy/.env
          mkdir -p deploy/keycloak
          cp infra/keycloak/fsp-realm.json deploy/keycloak/fsp-realm.json
          cp scripts/deploy-server.sh deploy/deploy-server.sh
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: >-
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/fsp/keycloak && chmod 700 ~/fsp'

          scp deploy/compose.yaml deploy/Caddyfile deploy/.env deploy/deploy-server.sh "$DEPLOY_USER@$DEPLOY_HOST:fsp/"

          scp deploy/keycloak/fsp-realm.json "$DEPLOY_USER@$DEPLOY_HOST:fsp/keycloak/"

          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u
          '$GHCR_USER' --password-stdin"

          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/fsp && sh deploy-server.sh'
      - name: Cleanup credentials
        if: always()
        run: rm -f deploy/.env ~/.ssh/id_ed25519 ~/.ssh/known_hosts
    permissions:
      contents: read
      packages: read
